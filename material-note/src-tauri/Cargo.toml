[package]
name = "material-note"
version = "1.0.0"
description = "Material Note - a fast, beautiful Material Design 3 notepad built with Tauri."
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
