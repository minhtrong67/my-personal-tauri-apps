[package]
name = "material-music-player"
version = "1.0.0"
description = "Material Music Player - Material Design 3 music player for Windows"
authors = ["minhtrong67"]
edition = "2021"

[lib]
name = "material_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
walkdir = "2"
base64 = "0.22"
