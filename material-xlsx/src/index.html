  <div class="busy" id="busy" hidden><span></span></div>

  <div id="app">
    <header class="appbar intro" style="--i:0">
      <div class="brand">
        <img class="logo" src="app-icon.png" alt="" width="32" height="32" />
        <div class="brand-text"><span class="appname">Material Xlsx</span><span class="docname" id="docname"></span></div>
      </div>
      <nav class="menus" id="menus"></nav>
      <div class="spacer"></div>
      <button class="btn text" id="btn-lang" aria-label="Language"></button>
      <button class="icon-btn" id="btn-theme"></button>
      <button class="icon-btn" id="btn-settings"><svg class="i"><use href="#i-settings"/></svg></button>
    </header>

    <div class="toolbar intro" id="toolbar" style="--i:1"></div>

    <div class="fbar intro" style="--i:2">
      <input class="namebox" id="namebox" spellcheck="false" autocomplete="off" />
      <span class="fx">fx</span>
      <div class="finput-wrap"><input class="finput" id="finput" spellcheck="false" autocomplete="off" /></div>
    </div>

    <main class="gridarea intro" style="--i:3"><div id="grid"></div></main>

    <footer class="bottom intro" style="--i:4">
      <div class="tabs-wrap">
        <button class="icon-btn" id="tab-add" data-i18n-title="tab.add"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="icon-btn" id="tab-prev" data-i18n-title="tab.prev"><svg class="i"><use href="#i-chevl"/></svg></button>
        <button class="icon-btn" id="tab-next" data-i18n-title="tab.next"><svg class="i"><use href="#i-chevr"/></svg></button>
        <div class="tabs" id="tabs"><div class="tab-ind" id="tab-ind"></div></div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="zoom">
        <button class="icon-btn" id="z-out" data-i18n-title="zoom.out"><svg class="i"><use href="#i-minus"/></svg></button>
        <input type="range" id="z-range" data-i18n-title="zoom.label" min="50" max="200" step="10" value="100" />
        <button class="icon-btn" id="z-in" data-i18n-title="zoom.in"><svg class="i"><use href="#i-plus"/></svg></button>
        <span class="zv" id="z-val">100%</span>
      </div>
    </footer>
  </div>

  <div id="layer"></div>
  <div class="snack" id="snack" role="status" aria-live="polite"><span class="st" id="snack-t"></span><button class="btn text" id="snack-a" hidden></button></div>
  <div id="print-root"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/mcu.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
