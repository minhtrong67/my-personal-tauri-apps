[package]
name = "material-file"
version = "1.0.0"
description = "Material File - a simple, fast file manager with Material Design 3, built with Tauri."
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["disk"] }
dirs = "6"
trash = "5"
open = "5"
tauri-plugin-window-state = "2"
