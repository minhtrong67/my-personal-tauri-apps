<!doctype html>
<html lang="en" data-scheme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Material File</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
  <script src="boot.js"></script>
</head>
<body>

    <symbol id="i-drive" viewBox="0 0 24 24"><path d="M22 12H2M5.5 5.1L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1zM6 16h.01M10 16h.01"/></symbol>

    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-paste" viewBox="0 0 24 24"><path d="M15 2H9a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
    <symbol id="i-rename" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-folder-plus" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2zM12 10v6M9 13h6"/></symbol>
    <symbol id="i-file-plus" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5M12 12v6M9 15h6"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 3h7v7M10 14L21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 10.8a2 2 0 0 1-1.1 1.8l-1.8.9A2 2 0 0 0 5 15.2V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.8a2 2 0 0 0-1.1-1.7l-1.8-.9A2 2 0 0 1 15 10.8V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></symbol>

    <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-panel-left" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></symbol>
    <symbol id="i-panel-right" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-copy-path" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  </svg>

  <!-- File-type icons (filled, drawn in 24px grid) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="f-folder" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h4.1c.5 0 1 .2 1.4.6L12.4 6h6.1A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><path d="M3 10h18v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z" fill="#fff" fill-opacity=".28"/></symbol>
    <symbol id="f-file" viewBox="0 0 24 24"><path d="M6 3h8l5 5v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3l5 5h-4a1 1 0 0 1-1-1z" fill="#fff" fill-opacity=".4"/></symbol>
    <symbol id="g-image" viewBox="0 0 24 24"><path d="M8 18l2.6-3 2 2.2L15 15l2 3z" fill="#fff" stroke="none"/><circle cx="9.5" cy="12.5" r="1" fill="#fff" stroke="none"/></symbol>
    <symbol id="g-video" viewBox="0 0 24 24"><path d="M10 11.5v6l5-3z" fill="#fff" stroke="none"/></symbol>
    <symbol id="g-audio" viewBox="0 0 24 24"><path d="M13.6 11.5v5.2M13.6 11.5l2.4.8" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="12.1" cy="16.8" r="1.5" fill="#fff" stroke="none"/></symbol>
    <symbol id="g-archive" viewBox="0 0 24 24"><path d="M12 10.5v8M10.7 12h2.6M10.7 14.5h2.6M10.7 17h2.6" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="g-doc" viewBox="0 0 24 24"><path d="M8.5 12.5h7M8.5 15h7M8.5 17.5h4" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="g-sheet" viewBox="0 0 24 24"><rect x="8.5" y="11.5" width="7" height="6.5" rx=".6" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M8.5 14.7h7M12 11.5V18" fill="none" stroke="#fff" stroke-width="1.4"/></symbol>
    <symbol id="g-slide" viewBox="0 0 24 24"><rect x="8.3" y="11.5" width="7.4" height="5" rx=".8" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M12 16.5v2" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="g-code" viewBox="0 0 24 24"><path d="M10.5 12l-2 2.8 2 2.8M13.5 12l2 2.8-2 2.8" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="g-exe" viewBox="0 0 24 24"><rect x="8.5" y="11.5" width="7" height="6.5" rx="1" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M8.5 13.8h7" fill="none" stroke="#fff" stroke-width="1.4"/></symbol>
  </svg>

  <div id="app">
    <div class="progress" id="progress" hidden></div>

    <!-- tab bar (app icon + folder tabs) -->
    <div class="tabbar">
      <img class="app-logo" src="assets/logo.svg" alt="Material File" width="26" height="26">
      <div class="ftabs" id="ftabs" role="tablist"></div>
      <button class="icon-btn small" id="btn-newtab" data-i18n-title="tab.new"><svg class="icon"><use href="#i-plus"/></svg></button>
    </div>

    <!-- navigation row -->
    <header class="navbar">
      <div class="nav-btns">
        <button class="icon-btn" id="btn-back" data-i18n-title="nav.back"><svg class="icon"><use href="#i-back"/></svg></button>
        <button class="icon-btn" id="btn-forward" data-i18n-title="nav.forward"><svg class="icon"><use href="#i-forward"/></svg></button>
        <button class="icon-btn" id="btn-up" data-i18n-title="nav.up"><svg class="icon"><use href="#i-up"/></svg></button>
        <button class="icon-btn" id="btn-refresh" data-i18n-title="nav.refresh"><svg class="icon"><use href="#i-refresh"/></svg></button>
      </div>
      <div class="address" id="address">
        <div class="crumbs" id="crumbs"></div>
        <button class="icon-btn small addr-copy" id="addr-copy" data-i18n-title="cmd.copyPathBtn"><svg class="icon"><use href="#i-copy-path"/></svg></button>
        <input id="address-input" class="address-input" type="text" spellcheck="false" autocomplete="off" hidden data-i18n-placeholder="address.placeholder">
      </div>
      <div class="search">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search-input" type="text" spellcheck="false" autocomplete="off" data-i18n-placeholder="search.placeholder">
        <button class="icon-btn small" id="search-clear" hidden><svg class="icon"><use href="#i-close"/></svg></button>
      </div>
      <div class="nav-actions">
        <button class="icon-btn" id="btn-theme" data-i18n-title="toolbar.theme"><svg class="icon"><use id="theme-use" href="#i-system"/></svg></button>
        <button class="icon-btn" id="btn-settings" data-i18n-title="toolbar.settings"><svg class="icon"><use href="#i-settings"/></svg></button>
        <button class="icon-btn" id="btn-about" data-i18n-title="toolbar.about"><svg class="icon"><use href="#i-info"/></svg></button>
      </div>
    </header>

    <!-- command bar -->
    <div class="cmdbar" id="cmdbar">
      <button class="cmd-btn" id="cmd-new"><svg class="icon"><use href="#i-plus"/></svg><span data-i18n="cmd.new"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <span class="cmd-sep"></span>
      <button class="icon-btn" id="cmd-cut" data-i18n-title="cmd.cut"><svg class="icon"><use href="#i-cut"/></svg></button>
      <button class="icon-btn" id="cmd-copy" data-i18n-title="cmd.copy"><svg class="icon"><use href="#i-copy"/></svg></button>
      <button class="icon-btn" id="cmd-paste" data-i18n-title="cmd.paste"><svg class="icon"><use href="#i-paste"/></svg></button>
      <button class="icon-btn" id="cmd-rename" data-i18n-title="cmd.rename"><svg class="icon"><use href="#i-rename"/></svg></button>
      <button class="icon-btn" id="cmd-delete" data-i18n-title="cmd.delete"><svg class="icon"><use href="#i-trash"/></svg></button>
      <span class="cmd-sep"></span>
      <button class="icon-btn" id="cmd-undo" data-i18n-title="cmd.undo"><svg class="icon"><use href="#i-undo"/></svg></button>
      <button class="cmd-btn" id="cmd-extract" hidden><svg class="icon"><use href="#i-archive"/></svg><span data-i18n="cmd.extractAll"></span></button>
      <span class="cmd-sep"></span>
      <button class="cmd-btn" id="cmd-sort"><svg class="icon"><use href="#i-sort"/></svg><span data-i18n="cmd.sort"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="cmd-btn" id="cmd-filter"><svg class="icon"><use href="#i-filter"/></svg><span data-i18n="cmd.filter"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="cmd-btn" id="cmd-view"><svg class="icon"><use id="view-use" href="#i-list"/></svg><span data-i18n="cmd.view"></span><svg class="icon caret"><use href="#i-chevron-down"/></svg></button>
      <button class="icon-btn" id="cmd-more" data-i18n-title="cmd.more"><svg class="icon"><use href="#i-more"/></svg></button>
      <span class="grow"></span>
      <button class="cmd-btn" id="cmd-props"><svg class="icon"><use href="#i-info"/></svg><span data-i18n="cmd.properties"></span></button>
    </div>

    <div class="body">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content">
        <div class="list" id="list" tabindex="0" role="listbox" aria-multiselectable="true"></div>
        <div class="empty" id="empty" hidden>
          <svg class="empty-ic"><use href="#f-folder"/></svg>
          <p id="empty-text"></p>
        </div>
      </main>
      <aside class="details-pane" id="details" hidden></aside>
    </div>

    <footer class="statusbar">
      <span id="st-items"></span>
      <span id="st-sel"></span>
      <span class="grow"></span>
      <button class="icon-btn small" id="st-pane" data-i18n-title="view.detailsPane"><svg class="icon"><use href="#i-panel-right"/></svg></button>
      <span class="st-sep"></span>
      <button class="icon-btn small" id="st-details" data-i18n-title="view.details"><svg class="icon"><use href="#i-list"/></svg></button>
      <button class="icon-btn small" id="st-grid" data-i18n-title="view.grid"><svg class="icon"><use href="#i-grid"/></svg></button>
    </footer>
  </div>

  <div id="menu-pop" class="menu-pop" role="menu" hidden></div>
  <div id="menu-sub" class="menu-pop" role="menu" hidden></div>
  <div id="snackbar" class="snackbar" role="status"></div>

  <!-- Settings -->
  <dialog id="dlg-settings" class="dlg dlg-wide">
    <h2 data-i18n="settings.title"></h2>

    <h3 data-i18n="settings.appearance"></h3>
    <div class="setting">
      <span class="label" data-i18n="settings.theme"></span>
      <div class="segmented" id="seg-theme">
        <label><input type="radio" name="theme" value="light"><span><svg class="icon"><use href="#i-sun"/></svg><b data-i18n="settings.light"></b></span></label>
        <label><input type="radio" name="theme" value="dark"><span><svg class="icon"><use href="#i-moon"/></svg><b data-i18n="settings.dark"></b></span></label>
        <label><input type="radio" name="theme" value="system"><span><svg class="icon"><use href="#i-system"/></svg><b data-i18n="settings.system"></b></span></label>
      </div>
    </div>
    <div class="setting">
      <span class="label" data-i18n="settings.color"></span>
      <div class="swatches" id="swatches"></div>
      <label class="custom-color">
        <input type="color" id="seed-input">
        <span data-i18n="settings.custom"></span>
      </label>
    </div>
    <div class="setting">
      <span class="label" data-i18n="settings.language"></span>
      <div class="segmented" id="seg-lang">
        <label><input type="radio" name="lang" value="en"><span><b>English</b></span></label>
        <label><input type="radio" name="lang" value="vi"><span><b>Tiếng Việt</b></span></label>
      </div>
    </div>

    <h3 data-i18n="settings.general"></h3>
    <div class="setting">
      <span class="label" data-i18n="settings.defaultView"></span>
      <div class="segmented" id="seg-view">
        <label><input type="radio" name="view" value="details"><span><svg class="icon"><use href="#i-list"/></svg><b data-i18n="view.details"></b></span></label>
        <label><input type="radio" name="view" value="grid"><span><svg class="icon"><use href="#i-grid"/></svg><b data-i18n="view.grid"></b></span></label>
      </div>
    </div>
    <label class="setting inline switch-row"><span class="label" data-i18n="settings.showExt"></span><input type="checkbox" class="switch" id="set-ext" role="switch"></label>
    <label class="setting inline switch-row"><span class="label" data-i18n="settings.showHidden"></span><input type="checkbox" class="switch" id="set-hidden" role="switch"></label>
    <label class="setting inline switch-row"><span class="label" data-i18n="settings.confirmDelete"></span><input type="checkbox" class="switch" id="set-confirm" role="switch"></label>

    <h3 data-i18n="settings.window"></h3>
    <label class="setting inline switch-row"><span class="label" data-i18n="settings.fullscreen"></span><input type="checkbox" class="switch" id="set-fullscreen" role="switch"></label>

    <div class="dlg-actions">
      <button class="btn-text" id="btn-reset" data-i18n="settings.reset"></button>
      <span class="grow"></span>
      <button class="btn-filled" id="settings-close" data-i18n="common.close"></button>
    </div>
  </dialog>

  <!-- About -->
  <dialog id="dlg-about" class="dlg">
    <div class="about">
      <img src="assets/logo.svg" alt="" width="84" height="84">
      <h2>Material File</h2>
      <p class="muted"><span data-i18n="about.version"></span> 1.0.0</p>
      <p data-i18n="about.desc"></p>
      <p class="about-credit"><span class="muted" data-i18n="about.author"></span>: <span class="credit-chip">minhtrong67</span></p>
      <p class="about-credit"><span class="credit-chip ai">Claude</span> <span class="muted small" data-i18n="about.ai"></span></p>
    </div>
    <div class="dlg-actions"><span class="grow"></span><button class="btn-filled" id="about-close" data-i18n="common.close"></button></div>
  </dialog>

  <!-- Properties -->
  <dialog id="dlg-props" class="dlg">
    <h2 data-i18n="props.title"></h2>
    <div class="props" id="props-body"></div>
    <div class="dlg-actions"><span class="grow"></span><button class="btn-filled" id="props-close" data-i18n="common.close"></button></div>
  </dialog>

  <!-- Prompt (batch rename) -->
  <dialog id="dlg-prompt" class="dlg">
    <h2 id="prm-title"></h2>
    <label class="field-label" id="prm-label" for="prm-input"></label>
    <input id="prm-input" class="field full" type="text" spellcheck="false" autocomplete="off">
    <div class="dlg-actions">
      <span class="grow"></span>
      <button class="btn-text" id="prm-cancel" data-i18n="common.cancel"></button>
      <button class="btn-filled" id="prm-ok" data-i18n="common.ok"></button>
    </div>
  </dialog>

  <!-- Generic confirm -->
  <dialog id="dlg-generic" class="dlg">
    <h2 id="dlg-title"></h2>
    <p id="dlg-message"></p>
    <div class="dlg-actions" id="dlg-actions"></div>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
