[package]
name = "claude-launcher"
version = "0.1.0"
description = "Open and close Chrome profiles straight into claude.ai"
authors = ["minhtrong67"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
