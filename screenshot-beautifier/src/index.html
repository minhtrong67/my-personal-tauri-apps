 ['Aurora',{bg:'gradient',c1:'#667eea',c2:'#764ba2',c3:'#f093fb',use3:true,angle:135,pad:80,radius:16,shOn:true,shBlur:70,shAlpha:.45,shY:30,frame:'browser',ftheme:'light'}],
 ['Glass',{bg:'gradient',c1:'#89f7fe',c2:'#66a6ff',use3:false,angle:135,pad:80,radius:22,shOn:true,shBlur:60,shAlpha:.3,shY:24,frame:'glass'}],
 ['Flat',{bg:'none',pad:0,radius:0,shOn:false,frame:'none',bdW:0}]];
function buildPanel(){
 const bg=EX('secBg',`${Sg('bg',[['gradient','bgGradient'],['solid','bgSolid'],['image','bgImage'],['none','bgNone']])}
  <div data-for="gradient" class="gp" id="gp">${PRESETS.map(([a,b],i)=>`<button class="gs" data-p="${i}" style="background:linear-gradient(135deg,${a},${b})"></button>`).join('')}</div>
  <div data-for="gradient">${R('angle',0,360,1,'angle')}</div><div data-for="gradient" class="two">${Cl('c1','color1')}${Cl('c2','color2')}</div>
  <div data-for="gradient">${Ck('use3','use3')}</div><div data-for="use3">${Cl('c3','color3')}</div>
  <div data-for="solid">${Cl('solid','color')}</div><div data-for="image"><button class="btn" id="bBg">${esc(t('pickBg'))}</button></div><div data-for="image">${R('blur',0,40,1,'blur')}</div>`);
 const lay=EX('secLayout',`${R('pad',0,240,2,'pad')}${R('radius',0,64,1,'radius')}
  <div class="fld"><div class="fl"><span>${esc(t('ratio'))}</span></div><select class="tx" data-k="ratio">${[['auto',t('auto')],['1:1','1:1'],['4:3','4:3'],['3:2','3:2'],['16:9','16:9'],['9:16','9:16'],['4:5','4:5'],['2:1','2:1'],['custom',t('custom')]].map(([v,l])=>`<option value="${v}">${esc(l)}</option>`).join('')}</select></div>
  <div data-for="custom" class="two"><div class="fld"><div class="fl"><span>${esc(t('width'))}</span></div><input class="tx" type="number" min="16" max="8000" data-k="cw"></div><div class="fld"><div class="fl"><span>${esc(t('height'))}</span></div><input class="tx" type="number" min="16" max="8000" data-k="ch"></div></div>
  ${R('bdW',0,16,1,'border')}<div data-for="border">${Cl('bdColor','bdColor')}</div><div data-for="border">${R('bdA',0,1,.05,'opacity')}</div>
  ${Ck('shOn','shadow')}<div data-for="shadow">${R('shBlur',0,150,1,'shBlur')}</div><div data-for="shadow">${R('shAlpha',0,1,.05,'opacity')}</div><div data-for="shadow">${R('shY',-60,100,1,'shY')}</div><div data-for="shadow">${Cl('shColor','color')}</div>`);
 const fr=EX('secFrame',`${Sg('frame',[['none','fNone'],['win','fWin'],['mac','fMac'],['browser','fBrowser'],['glass','fGlass']])}<div data-for="frame">${Sg('ftheme',[['light','fLight'],['dark','fDark']])}</div><div data-for="frame">${Tx('ftitle','fTitle')}</div>`);
 const cap=EX('secCap',`${Tx('cap','capText')}<div data-for="cap">${Sg('capPos',[['top','capTop'],['bottom','capBottom']])}</div><div data-for="cap">${R('capSize',10,64,1,'size')}</div><div data-for="cap">${Cl('capColor','color')}</div>`);
 const ann=EX('secAnn',`${Sg('tool',[['none','tNone'],['rect','tRect'],['arrow','tArrow'],['text','tText'],['hl','tHl'],['blur','tBlur']])}<div class="hint">${esc(t('annHint'))}</div>${Cl('ac','color')}${R('alw',1,16,1,'stroke')}${R('asz',12,96,1,'size')}${R('apx',4,40,1,'pixel')}
  <div class="cg"><button class="btn" id="aClear">${esc(t('clearAnn'))}</button></div>`);
 const ex=EX('secExp',`${Sg('fmt',[['png','~PNG'],['jpeg','~JPEG'],['webp','~WebP']])}<div data-for="fq">${R('q',.5,1,.01,'quality')}</div><div class="fld"><div class="fl"><span>${esc(t('scale'))}</span></div>${Sg('sc',[[1,'~1x'],[2,'~2x'],[3,'~3x']])}</div><div class="hint">${esc(t('outSize'))}: <b id="oinfo"></b></div>`);
 $('#panel').innerHTML=`<details class="ex" open><summary>${esc(t('looks'))}</summary><div class="exb"><div class="cg" id="looks">${LOOKS.map(([n],i)=>`<button class="btn" data-look="${i}">${n}</button>`).join('')}</div></div></details>`+bg+lay+fr+cap+ann+ex;sync()}
function sync(){const vis={gradient:P.bg=='gradient',solid:P.bg=='solid',image:P.bg=='image',use3:P.bg=='gradient'&&P.use3,custom:P.ratio=='custom',border:P.bdW>0,shadow:P.shOn,frame:P.frame!='none'&&P.frame!='glass',cap:!!P.cap,fq:P.fmt!='png'};
 $$('[data-for]').forEach(e=>e.hidden=!vis[e.dataset.for]);
 $$('#panel [data-k]').forEach(e=>{const k=e.dataset.k;if(e.type=='checkbox')e.checked=!!P[k];else{e.value=P[k];if(e.type=='range'){const mn=+e.min,mx=+e.max;e.style.setProperty('--p',((P[k]-mn)/(mx-mn)*100)+'%')}}});
 $$('#panel [data-o]').forEach(o=>{const k=o.dataset.o,v=P[k];o.textContent=k=='angle'?v+'°':(k=='bdA'||k=='shAlpha')?Math.round(v*100)+'%':k=='q'?Math.round(v*100)+'%':v});
 $$('#panel [data-seg]').forEach(s=>$$('button',s).forEach(b=>b.classList.toggle('on',String(b.dataset.v)==String(P[s.dataset.seg]))));
 $$('#gp .gs').forEach((b,i)=>b.classList.toggle('on',PRESETS[i][0]==P.c1&&PRESETS[i][1]==P.c2));$$('#looks .btn').forEach(()=>0)}
const saveP=()=>ls('P',JSON.stringify(P));
$('#panel').addEventListener('input',e=>{const el=e.target,k=el.dataset.k;if(!k)return;P[k]=el.type=='checkbox'?el.checked:(el.type=='range'||el.type=='number')?+el.value:el.value;saveP();sync();redraw()});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.parentElement.dataset.seg){const k=b.parentElement.dataset.seg,v=b.dataset.v;P[k]=isNaN(v)?v:+v;saveP();sync();redraw();return}
 if(b.dataset.p!=null){const [a,c]=PRESETS[+b.dataset.p];P.c1=a;P.c2=c;P.use3=false;P.bg='gradient';saveP();sync();redraw()}
 else if(b.dataset.look!=null){Object.assign(P,LOOKS[+b.dataset.look][1]);saveP();sync();redraw()}
 else if(b.id=='bBg')$('#fileBg').click();else if(b.id=='aClear'&&S.ann.length){pushHist();S.ann=[];redraw()}});
$('#fileBg').onchange=e=>{const f=e.target.files[0];if(f){const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{S.bgImg=im;P.bg='image';saveP();sync();redraw()};im.src=u}e.target.value=''};
/* ---------- canvas interaction: annotate + crop ---------- */
const cv=$('#cv');
function pt(e){const r=cv.getBoundingClientRect(),fx=(e.clientX-r.left)/r.width,fy=(e.clientY-r.top)/r.height;
 if(S.cropMode)return {x:Math.max(0,Math.min(S.crop.w,fx*S.crop.w)),y:Math.max(0,Math.min(S.crop.h,fy*S.crop.h))};
 const L=S.L;return {x:Math.max(0,Math.min(L.iw,fx*L.W-L.ix)),y:Math.max(0,Math.min(L.ih,fy*L.H-L.iy))}}
cv.addEventListener('pointerdown',e=>{if(!S.img)return;const p=pt(e);
 if(S.cropMode){S.sel={x0:p.x,y0:p.y,x1:p.x,y1:p.y};cv.setPointerCapture(e.pointerId);return}
 if(P.tool=='none')return;if(P.tool=='text'){textBox(e,p);return}
 S.cur={t:P.tool,x:p.x,y:p.y,w:0,h:0,x1:p.x,y1:p.y,ox:p.x,oy:p.y,c:P.ac,lw:P.alw,px:P.apx};cv.setPointerCapture(e.pointerId)});
function dragTo(a,p){if(a.t=='arrow'){a.x1=p.x;a.y1=p.y}else{a.x=Math.min(a.ox,p.x);a.y=Math.min(a.oy,p.y);a.w=Math.abs(p.x-a.ox);a.h=Math.abs(p.y-a.oy)}}
cv.addEventListener('pointermove',e=>{if(S.cropMode){if(S.sel&&e.buttons){const p=pt(e);S.sel.x1=p.x;S.sel.y1=p.y;redraw()}return}if(!S.cur)return;dragTo(S.cur,pt(e));redraw()});
cv.addEventListener('pointerup',e=>{if(S.cropMode)return;const a=S.cur;if(!a)return;S.cur=null;dragTo(a,pt(e));
 const tiny=a.t=='arrow'?Math.hypot(a.x1-a.x,a.y1-a.y)<6:(a.w<4||a.h<4);if(tiny){redraw();return}pushHist();S.ann.push(a);redraw()});
function textBox(e,p){const st=$('#stage').getBoundingClientRect(),i=document.createElement('input');i.id='tbx';i.style.left=(e.clientX-st.left)+'px';i.style.top=(e.clientY-st.top)+'px';$('#stage').append(i);i.focus();let done=false;
 const end=ok=>{if(done)return;done=true;const v=i.value.trim();i.remove();if(ok&&v){pushHist();S.ann.push({t:'text',x:p.x,y:p.y,s:v,c:P.ac,size:P.asz});redraw()}};
 i.onkeydown=ev=>{if(ev.key=='Enter')end(true);else if(ev.key=='Escape')end(false)};i.onblur=()=>end(true)}
function enterCrop(){if(!S.img)return;S.cropMode=true;S.sel=null;$('#cropbar').hidden=false;cv.classList.add('draw');redraw()}
function exitCrop(){S.cropMode=false;S.sel=null;$('#cropbar').hidden=true;redraw()}
$('#cOk').onclick=()=>{const s=selRect();if(!s||s.w<8||s.h<8){exitCrop();return}pushHist();const dx=Math.round(s.x),dy=Math.round(s.y);
 S.ann.forEach(a=>{a.x-=dx;a.y-=dy;if(a.x1!=null){a.x1-=dx;a.y1-=dy}});S.crop={x:S.crop.x+dx,y:S.crop.y+dy,w:Math.round(s.w),h:Math.round(s.h)};exitCrop()};
$('#cReset').onclick=()=>{const c=S.crop;if(c.x||c.y||c.w!=iw(S.img)||c.h!=ih(S.img)){pushHist();S.ann.forEach(a=>{a.x+=c.x;a.y+=c.y;if(a.x1!=null){a.x1+=c.x;a.y1+=c.y}});S.crop={x:0,y:0,w:iw(S.img),h:ih(S.img)}}S.sel=null;redraw()};
$('#cNo').onclick=exitCrop;
/* ---------- export ---------- */
let tt;function toast(m){const e=$('#sb');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
const MIME={png:'image/png',jpeg:'image/jpeg',webp:'image/webp'};
const toBlob=(c,ty,q)=>new Promise(r=>c.toBlob(r,ty,q));
const b64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(b)});
async function doCopy(){if(!S.img)return toast(t('noImage'));try{const b=await toBlob(renderExport(),'image/png');await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast(t('copied'))}catch{toast(t('copyFail'))}}
async function doSave(){if(!S.img)return toast(t('noImage'));if(exportScale()<P.sc)toast(t('limited'));const b=await toBlob(renderExport(),MIME[P.fmt],P.q),name=`${S.name}-beautified.${P.fmt=='jpeg'?'jpg':P.fmt}`;
 if(TA){try{if(await TA.core.invoke('save_image',{name,data:await b64(b)}))toast(t('saved'))}catch{toast(t('saveFail'))}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();toast(t('saved'))}}
/* ---------- settings dialog ---------- */
function setBody(){const seg=(a,l,c)=>`<div class="seg">${l.map(([v,n])=>`<button ${a}="${v}" class="${v==c?'on':''}">${esc(n)}</button>`).join('')}</div>`,cu=!PALETTE.some(p=>p.toLowerCase()==accent.toLowerCase());
 $('#setBody').innerHTML=`<h3>${esc(t('sTheme'))}</h3>${seg('data-th',[['system',t('system')],['light',t('light')],['dark',t('dark')]],theme)}<h3>${esc(t('sLang'))}</h3>${seg('data-lg',[['vi','Tiếng Việt'],['en','English']],lang)}
 <h3>${esc(t('sColor'))}</h3><div class="swr">${PALETTE.map(p=>`<button class="swc${p.toLowerCase()==accent.toLowerCase()?' on':''}" data-a="${p}" title="${p}" style="background:${p}">${ico('check')}</button>`).join('')}</div>
 <div class="swr" style="margin-top:6px;grid-template-columns:40px 1fr"><button class="swc cu${cu?' on':''}" data-custom title="${esc(t('customColor'))}">${ico('check')}</button><div class="hint" style="align-self:center">${esc(t('customColor'))}: ${esc(accent.toUpperCase())}</div></div>`}
function applyI18n(){document.documentElement.lang=lang;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-t]').forEach(e=>e.title=t(e.dataset.t));buildPanel();info();if($('#dSet').open)setBody()}
/* ---------- wiring ---------- */
$('#bOpen').onclick=$('#bOpen2').onclick=pick;$('#bPaste').onclick=$('#bPaste2').onclick=pasteBtn;$('#bSample').onclick=()=>setSource(makeSample(),'sample');
$('#file').onchange=e=>{const f=e.target.files[0];if(f)fromBlob(f,f.name);e.target.value=''};
$('#bCrop').onclick=()=>S.cropMode?exitCrop():enterCrop();$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;$('#bCopy').onclick=doCopy;$('#bSave').onclick=doSave;
$('#bSet').onclick=()=>{setBody();$('#dSet').showModal()};$('#bAbout').onclick=()=>$('#dAbout').showModal();$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#setBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.th){theme=b.dataset.th;ls('theme',theme);paint()}else if(b.dataset.lg){lang=b.dataset.lg;ls('lang',lang);applyI18n()}
 else if(b.dataset.a){accent=b.dataset.a;ls('accent',accent);paint()}else if('custom' in b.dataset){$('#cc').value=accent.toLowerCase();$('#cc').click();return}setBody()};
$('#cc').oninput=e=>{accent=e.target.value;ls('accent',accent);paint();setBody()};
document.addEventListener('paste',e=>{const it=[...(e.clipboardData?e.clipboardData.items:[])].find(x=>x.type.startsWith('image/'));if(it){e.preventDefault();fromBlob(it.getAsFile(),'pasted')}});
['dragover','dragenter'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#empty').classList.add('drag')}));['dragleave','drop'].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$('#empty').classList.remove('drag')}));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&f.type.startsWith('image/')&&!TA)fromBlob(f,f.name)});
document.addEventListener('keydown',e=>{if(e.target.tagName=='INPUT'&&e.target.type=='text'||e.target.tagName=='SELECT')return;const k=e.key.toLowerCase();
 if(e.ctrlKey&&k=='o'){e.preventDefault();pick()}else if(e.ctrlKey&&k=='s'){e.preventDefault();doSave()}else if(e.ctrlKey&&e.shiftKey&&k=='c'){e.preventDefault();doCopy()}
 else if(e.ctrlKey&&k=='z'){e.preventDefault();undo()}else if(e.ctrlKey&&k=='y'){e.preventDefault();redo()}
 else if(S.cropMode&&k=='enter')$('#cOk').click();else if(S.cropMode&&k=='escape')exitCrop()});
if(window.ResizeObserver)new ResizeObserver(()=>redraw()).observe($('#stage'));
if(TA){document.body.classList.add('tw');TA.event.listen('tauri://drag-drop',e=>{$('#empty').classList.remove('drag');const p=e.payload&&e.payload.paths&&e.payload.paths[0];if(p)fromPath(p)});
 TA.event.listen('tauri://drag-enter',()=>$('#empty').classList.add('drag'));TA.event.listen('tauri://drag-leave',()=>$('#empty').classList.remove('drag'));
 const W=TA.window.getCurrentWindow();W.isDecorated().then(d=>{if(d)document.body.classList.add('native')}).catch(()=>{});
 $('#wMin').onclick=()=>W.minimize();$('#wMax').onclick=()=>W.toggleMaximize();$('#wClose').onclick=()=>W.close();
 const sync2=()=>W.isMaximized().then(m=>{$('#wMax').textContent=m?'\uE923':'\uE922'}).catch(()=>{});W.onResized(sync2);sync2()}
paint();applyI18n();btns();
</script></body></html>
