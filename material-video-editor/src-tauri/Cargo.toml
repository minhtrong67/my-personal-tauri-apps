[package]
name = "material-video-editor"
version = "1.0.0"
description = "A simple, Material Design 3 video editor."
authors = ["minhtrong67"]
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
