<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Viewer</title>
<style>
/* Material Design 3 tokens. Baseline purple; JS repaints them from the chosen seed color and theme. */
:root{--primary:#6750a4;--on-primary:#fff;--p-cont:#eaddff;--on-p-cont:#21005d;--sec-cont:#e8def8;--on-sec-cont:#1d192b;--surface:#fef7ff;--s-low:#f7f2fa;--s-cont:#f3edf7;--s-high:#ece6f0;--s-highest:#e6e0e9;--on-surface:#1d1b20;--on-var:#49454f;--outline:#79747e;--outline-v:#cac4d0;--inv:#322f35;--on-inv:#f5eff7;--err:#b3261e;--on-err:#fff;
--e1:0 1px 2px rgba(0,0,0,.3),0 1px 3px 1px rgba(0,0,0,.15);--e3:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);--ts:180px;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}[hidden]{display:none!important}
body{font:400 14px/20px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.25px;color:var(--on-surface);background:var(--surface);overflow:hidden;-webkit-font-smoothing:antialiased}
svg.i{width:24px;height:24px;fill:currentColor;flex:none}button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-thumb{background:var(--outline);border-radius:8px;border:4px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{border-width:3px}
.sl{position:relative;overflow:hidden}.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s;pointer-events:none}.sl:hover::after{opacity:.08}.sl:focus-visible::after{opacity:.1}.sl:active::after{opacity:.12}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}.sp{flex:1}
.app{display:flex;height:100vh}.col{flex:1;min-width:0;display:flex;flex-direction:column}
/* navigation rail (bottom bar on compact windows) */
#rail{width:80px;flex:none;display:flex;flex-direction:column;align-items:center;gap:12px;padding:44px 0 16px;background:var(--surface)}
.ri{display:flex;flex-direction:column;align-items:center;gap:4px;width:72px;border:0;background:transparent;color:var(--on-var);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;cursor:pointer}
.ri .pill{display:grid;place-items:center;width:56px;height:32px;border-radius:16px;transition:background .2s}.ri.on{color:var(--on-surface)}.ri.on .pill{background:var(--sec-cont);color:var(--on-sec-cont)}.ri:disabled{opacity:.38;pointer-events:none}.ri:hover .pill{background:var(--s-high)}.ri.on:hover .pill{background:var(--sec-cont)}
/* top app bar */
.tb{display:flex;align-items:center;gap:4px;height:64px;flex:none;padding:0 12px 0 8px}.ttl{min-width:0;padding:0 8px}.ttl h1{margin:0;font:400 22px/28px system-ui,"Segoe UI",sans-serif;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl div{font-size:12px;line-height:16px;color:var(--on-var);white-space:nowrap}
.acts{display:flex;align-items:center;gap:2px}
.ib{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--on-var);display:inline-grid;place-items:center;cursor:pointer;flex:none}.ib:disabled{opacity:.38;pointer-events:none}.ib.on{background:var(--sec-cont);color:var(--on-sec-cont)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border:0;border-radius:20px;font:500 14px/20px system-ui,"Segoe UI",sans-serif;letter-spacing:.1px;cursor:pointer;white-space:nowrap}
.btn svg.i{width:18px;height:18px;margin-left:-8px}.btn.filled{background:var(--primary);color:var(--on-primary)}.btn.tonal{background:var(--sec-cont);color:var(--on-sec-cont)}.btn.text{padding:0 12px;background:transparent;color:var(--primary)}.btn.outl{border:1px solid var(--outline);background:transparent;color:var(--primary)}.btn.err{background:var(--err);color:var(--on-err)}.btn:disabled{opacity:.38;pointer-events:none}
.view{flex:1;min-height:0;position:relative}
/* gallery */
#vGal{display:flex;flex-direction:column;background:var(--s-low);border-radius:16px 0 0 0;overflow:hidden}
.gtool{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px 8px}.search{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:24px;background:var(--s-high);flex:1;min-width:200px;max-width:520px;color:var(--on-var)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--on-surface);font-size:16px}.search input::placeholder{color:var(--on-var)}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--outline);border-radius:8px;background:transparent;color:var(--on-var);font:500 14px/20px system-ui,"Segoe UI",sans-serif;letter-spacing:.1px;cursor:pointer}.chip svg.i{width:18px;height:18px}
#grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--ts),1fr));grid-auto-rows:var(--ts);gap:8px;padding:8px 24px 24px;align-content:start}
.tile{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--s-highest);cursor:pointer}.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .tn{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;font-size:12px;line-height:16px;color:#fff;text-align:left;background:linear-gradient(transparent,rgba(0,0,0,.6));opacity:0;transition:opacity .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile:hover .tn,.tile:focus-visible .tn{opacity:1}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}.empty .lg{width:96px;height:96px}.empty h2{margin:20px 0 8px;font:400 28px/36px system-ui,"Segoe UI",sans-serif;letter-spacing:0}.empty p{margin:0 auto 24px;max-width:420px;color:var(--on-var)}.empty .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#vGal.drag{outline:3px dashed var(--primary);outline-offset:-12px}
/* viewer */
#vView{background:var(--s-low);border-radius:16px 0 0 0;overflow:hidden;display:flex}.vmain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#vstage{flex:1;min-height:0;position:relative;overflow:hidden;cursor:grab;touch-action:none}#vstage.pan{cursor:grabbing}
#vimg{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;transform-origin:center}
.nav{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;background:color-mix(in srgb,var(--inv) 55%,transparent);color:var(--on-inv);opacity:0;transition:opacity .2s}#vstage:hover .nav{opacity:1}.nav.l{left:16px}.nav.r{right:16px}
#strip{flex:none;display:flex;gap:6px;overflow-x:auto;padding:6px 16px;height:76px}#strip button{flex:none;width:60px;height:60px;border:2px solid transparent;border-radius:8px;padding:0;overflow:hidden;background:var(--s-highest);cursor:pointer;opacity:.75}#strip button.on{border-color:var(--primary);opacity:1}#strip img{width:100%;height:100%;object-fit:cover;display:block}
.ftool{display:flex;align-items:center;gap:2px;align-self:center;margin:6px 0 14px;padding:4px 8px;border-radius:28px;background:var(--s-high);box-shadow:var(--e1);max-width:calc(100% - 24px);overflow-x:auto}.ftool .vl{width:1px;height:24px;background:var(--outline-v);margin:0 6px;flex:none}.ftool .zv{min-width:48px;text-align:center;font-size:12px;color:var(--on-var)}
#info{width:320px;flex:none;overflow:auto;padding:16px 20px;background:var(--surface);border-left:1px solid var(--outline-v)}#info h3{margin:4px 0 16px;font:400 22px/28px system-ui,"Segoe UI",sans-serif;letter-spacing:0}.kv{padding:10px 0}.kv small{display:block;color:var(--on-var);font-size:12px;line-height:16px}.kv div{word-break:break-all}
/* editor */
#vEdit{display:flex;background:var(--s-low);border-radius:16px 0 0 0;overflow:hidden}#estage{flex:1;min-width:0;position:relative;display:grid;place-items:center;overflow:hidden;padding:24px}
#ecv{display:block;max-width:100%;max-height:100%;border-radius:4px;box-shadow:var(--e1);background:repeating-conic-gradient(var(--s-highest) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;touch-action:none}#ecv.pen{cursor:crosshair}
#cbox{position:absolute;box-shadow:0 0 0 9999px rgba(0,0,0,.55);border:2px solid #fff;cursor:move;touch-action:none}#cbox i{position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#cbox i[data-h=nw]{left:-8px;top:-8px;cursor:nwse-resize}#cbox i[data-h=ne]{right:-8px;top:-8px;cursor:nesw-resize}#cbox i[data-h=sw]{left:-8px;bottom:-8px;cursor:nesw-resize}#cbox i[data-h=se]{right:-8px;bottom:-8px;cursor:nwse-resize}
#cbox i[data-h=n]{left:50%;top:-8px;margin-left:-7px;cursor:ns-resize}#cbox i[data-h=s]{left:50%;bottom:-8px;margin-left:-7px;cursor:ns-resize}#cbox i[data-h=w]{top:50%;left:-8px;margin-top:-7px;cursor:ew-resize}#cbox i[data-h=e]{top:50%;right:-8px;margin-top:-7px;cursor:ew-resize}
#epanel{width:348px;flex:none;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--outline-v)}
.etabs{display:flex;border-bottom:1px solid var(--outline-v)}.etab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:0;background:transparent;color:var(--on-var);font:500 12px/16px system-ui,"Segoe UI",sans-serif;cursor:pointer;border-bottom:3px solid transparent}.etab.on{color:var(--primary);border-bottom-color:var(--primary)}
.ebody{flex:1;overflow:auto;padding:16px 20px}.ebody>*{margin-bottom:16px}.efoot{padding:12px 20px 16px;border-top:1px solid var(--outline-v);display:flex;flex-direction:column;gap:12px}.efoot .row2{display:flex;gap:8px}.efoot .row2 .btn{flex:1;padding:0 12px}
.fld .fl{display:flex;justify-content:space-between;color:var(--on-var);font-size:12px;line-height:16px;margin-bottom:2px}.fld .fl output{color:var(--on-surface)}.gl{font:500 12px/16px system-ui,"Segoe UI",sans-serif;letter-spacing:.5px;color:var(--on-var);margin-bottom:8px}
input[type=range]{appearance:none;width:100%;height:24px;margin:0;background:transparent}input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(var(--primary),var(--primary)) 0/var(--p,50%) 100% no-repeat,var(--sec-cont)}
input[type=range]::-webkit-slider-thumb{appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 16%,transparent);transition:box-shadow .15s}input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 8px color-mix(in srgb,var(--primary) 16%,transparent)}
.seg{display:flex}.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 10px;border:1px solid var(--outline);background:transparent;color:var(--on-surface);font:500 14px/20px system-ui,"Segoe UI",sans-serif;cursor:pointer;min-width:0;white-space:nowrap;overflow:hidden}
.seg button+button{margin-left:-1px}.seg button:first-child{border-radius:20px 0 0 20px}.seg button:last-child{border-radius:0 20px 20px 0}.seg .ck{display:none;width:18px;height:18px;fill:currentColor;flex:none}.seg .on{background:var(--sec-cont);color:var(--on-sec-cont)}.seg .on .ck{display:block}
.cg{display:flex;flex-wrap:wrap;gap:8px}.chip.on{background:var(--sec-cont);color:var(--on-sec-cont);border-color:transparent}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.fc{border:2px solid transparent;border-radius:12px;padding:0;background:var(--s-high);overflow:hidden;cursor:pointer;color:var(--on-surface);text-align:center}.fc.on{border-color:var(--primary)}.fc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.fc span{display:block;padding:4px 2px;font-size:12px;line-height:16px}
.sw{appearance:none;flex:none;width:52px;height:32px;border-radius:16px;border:2px solid var(--outline);background:var(--s-highest);position:relative;margin:0;cursor:pointer;transition:.2s}.sw::after{content:"";position:absolute;top:50%;left:6px;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--outline);transition:.2s}
.sw:checked{background:var(--primary);border-color:var(--primary)}.sw:checked::after{left:22px;width:24px;height:24px;margin-top:-12px;background:var(--on-primary)}
.swr{display:flex;flex-wrap:wrap;gap:10px}.swc{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;padding:0}.swc svg{display:none;width:22px;height:22px;fill:currentColor}.swc.on svg{display:block}.swc.cu{background:conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.inkc{width:32px;height:32px}.hint{font-size:12px;line-height:16px;color:var(--on-var)}
/* menu, dialog, snackbar */
.menu{position:fixed;z-index:60;min-width:200px;padding:8px 0;border-radius:4px;background:var(--s-cont);box-shadow:var(--e3)}.menu hr{border:0;border-top:1px solid var(--outline-v);margin:8px 0}.mi{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;border:0;background:transparent;text-align:left;cursor:pointer}.mi svg.i,.mi .ph{width:24px;height:24px;flex:none;color:var(--on-var)}
dialog{border:0;border-radius:28px;background:var(--s-high);color:var(--on-surface);padding:24px;width:min(560px,92vw);box-shadow:var(--e3)}dialog::backdrop{background:rgba(0,0,0,.32)}dialog h2{margin:0 0 16px;font:400 24px/32px system-ui,"Segoe UI",sans-serif;letter-spacing:0}dialog h3{margin:20px 0 8px;font:500 14px/20px system-ui,"Segoe UI",sans-serif;color:var(--on-var)}.da{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
#sb{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);min-width:min(344px,92vw);background:var(--inv);color:var(--on-inv);border-radius:4px;padding:14px 16px;box-shadow:var(--e3);opacity:0;pointer-events:none;transition:.2s;z-index:80}#sb.on{opacity:1;transform:translateX(-50%)}
#printimg{display:none}@media print{body>*:not(#printimg){display:none!important}#printimg{display:block;max-width:100%;max-height:100vh;margin:auto}}
body.fs #rail,body.fs .tb,body.fs #strip{display:none}body.fs #vView,body.fs #vEdit{border-radius:0}
@media(max-width:719px){.app{flex-direction:column-reverse}#rail{width:auto;flex-direction:row;justify-content:space-around;padding:8px 0 12px;gap:0;background:var(--s-cont)}#rail .sp{display:none}#vGal,#vView,#vEdit{border-radius:0}.tb{height:56px}#info{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:var(--e3)}#vEdit{flex-direction:column}#epanel{width:auto;height:46%;border-left:0;border-top:1px solid var(--outline-v)}#strip{display:none}}
@media(max-width:1000px){#info{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:var(--e3)}}
</style></head><body>
<div class="app">
<nav id="rail"><button class="ri sl on" data-nav="gal"><span class="pill"><svg class="i" data-ic="grid" viewBox="0 0 24 24"></svg></span><span data-i="navGal"></span></button>
<button class="ri sl" data-nav="view" disabled><span class="pill"><svg class="i" data-ic="image" viewBox="0 0 24 24"></svg></span><span data-i="navView"></span></button>
<button class="ri sl" data-nav="edit" disabled><span class="pill"><svg class="i" data-ic="edit" viewBox="0 0 24 24"></svg></span><span data-i="navEdit"></span></button><div class="sp"></div>
<button class="ri sl" id="bSet"><span class="pill"><svg class="i" data-ic="settings" viewBox="0 0 24 24"></svg></span><span data-i="settings"></span></button></nav>
<div class="col">
<header class="tb"><button class="ib sl" id="bBack" hidden data-t="back"><svg class="i" data-ic="back" viewBox="0 0 24 24"></svg></button><div class="ttl"><h1 id="tTitle"></h1><div id="tSub"></div></div><div class="sp"></div>
<div class="acts" data-act="gal"><button class="ib sl" id="bOpenF" data-t="openFile"><svg class="i" data-ic="addimg" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bOpenD" data-t="openFolder"><svg class="i" data-ic="folder" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bSlide0" data-t="slideshow"><svg class="i" data-ic="play" viewBox="0 0 24 24"></svg></button></div>
<div class="acts" data-act="view" hidden><button class="ib sl" id="bInfo" data-t="info"><svg class="i" data-ic="info" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bPrint" data-t="print"><svg class="i" data-ic="print" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bReveal" data-t="reveal"><svg class="i" data-ic="folder" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bFs" data-t="fullscreen"><svg class="i" data-ic="fs" viewBox="0 0 24 24"></svg></button></div>
<div class="acts" data-act="edit" hidden><button class="ib sl" id="eUndo" data-t="undo"><svg class="i" data-ic="undo" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="eRedo" data-t="redo"><svg class="i" data-ic="redo" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="eCmp" data-t="compare"><svg class="i" data-ic="compare" viewBox="0 0 24 24"></svg></button></div>
<button class="ib sl" id="bAbout" data-t="about"><svg class="i" data-ic="info" viewBox="0 0 24 24"></svg></button></header>
<section class="view" id="vGal"><div class="gtool"><label class="search"><svg class="i" data-ic="search" viewBox="0 0 24 24"></svg><input id="q" data-t="search" autocomplete="off"></label>
<button class="chip sl" id="bSort"><svg class="i" data-ic="sort" viewBox="0 0 24 24"></svg><span id="sortL"></span></button><input type="range" id="tsr" min="110" max="340" step="10" style="width:140px" data-t="tileSize"></div>
<div id="grid"></div><div class="empty" id="gEmpty"><svg class="lg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#6750A4"/><rect x="6.5" y="8" width="19" height="15.6" rx="2.4" fill="#fff"/><rect x="8" y="9.5" width="16" height="12.6" rx="1.4" fill="#EADDFF"/><path d="M8 22.1l5.5-7.8 3.8 4.9 2.5-3.2 4.2 6.1z" fill="#6750A4"/><circle cx="20.6" cy="12.8" r="2.1" fill="#EFB8C8"/></svg><h2 data-i="emptyT"></h2><p data-i="emptyH"></p><div class="row"><button class="btn filled sl" id="eOpenD"><svg class="i" data-ic="folder" viewBox="0 0 24 24"></svg><span data-i="openFolder"></span></button><button class="btn tonal sl" id="eOpenF"><svg class="i" data-ic="addimg" viewBox="0 0 24 24"></svg><span data-i="openFile"></span></button></div></div></section>
<section class="view" id="vView" hidden><div class="vmain"><div id="vstage"><img id="vimg" alt="" draggable="false"><button class="ib nav l sl" id="vPrev"><svg class="i" data-ic="chl" viewBox="0 0 24 24"></svg></button><button class="ib nav r sl" id="vNext"><svg class="i" data-ic="chr" viewBox="0 0 24 24"></svg></button></div>
<div id="strip"></div>
<div class="ftool"><button class="ib sl" id="fPrev" data-t="prev"><svg class="i" data-ic="chl" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="fNext" data-t="next"><svg class="i" data-ic="chr" viewBox="0 0 24 24"></svg></button><span class="vl"></span>
<button class="ib sl" id="zOut" data-t="zoomOut"><svg class="i" data-ic="zout" viewBox="0 0 24 24"></svg></button><span class="zv" id="zv">100%</span><button class="ib sl" id="zIn" data-t="zoomIn"><svg class="i" data-ic="zin" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="zFit" data-t="fit"><svg class="i" data-ic="fit" viewBox="0 0 24 24"></svg></button><span class="vl"></span>
<button class="ib sl" id="rL" data-t="rotL"><svg class="i" data-ic="rl" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="rR" data-t="rotR"><svg class="i" data-ic="rr" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bEdit" data-t="edit"><svg class="i" data-ic="edit" viewBox="0 0 24 24"></svg></button><span class="vl"></span>
<button class="ib sl" id="bCopy" data-t="copy"><svg class="i" data-ic="copy" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bDel" data-t="del"><svg class="i" data-ic="del" viewBox="0 0 24 24"></svg></button><button class="ib sl" id="bSlide" data-t="slideshow"><svg class="i" data-ic="play" viewBox="0 0 24 24"></svg></button></div></div>
<aside id="info" hidden></aside></section>
<section class="view" id="vEdit" hidden><div id="estage"><canvas id="ecv"></canvas><div id="cbox" hidden><i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i><i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i></div></div><aside id="epanel"></aside></section>
