 let fm='';const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---\s*(\r?\n|$)/);if(m){fm=m[1];text=text.slice(m[0].length)}
 const md=$('#md');md.innerHTML=(fm?`<details class="fm"><summary>Front matter</summary><pre><code>${esc(fm)}</code></pre></details>`:'')+DOMPurify.sanitize(marked.parse(text));
 const used=new Set();toc=[];
 md.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(h=>{h.id=slug(h.textContent,used);toc.push({l:+h.tagName[1],t:h.textContent,id:h.id,el:h})});
 md.querySelectorAll('pre>code').forEach(c=>{const pre=c.parentElement,lg=(c.className.match(/language-([\w+-]+)/)||[])[1]||'';
  if(lg&&window.hljs&&hljs.getLanguage(lg))try{hljs.highlightElement(c)}catch{}
  const w=document.createElement('div');w.className='cb';w.innerHTML=`<div class="ch"><span>${esc(lg||'text')}</span><button class="cp">${esc(t('copy'))}</button></div>`;pre.replaceWith(w);w.append(pre)});
 md.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.replaceWith(w);w.append(tb)});
 md.querySelectorAll('img[src]').forEach(loadImg);buildToc()}
function loadImg(img){const s=img.getAttribute('src');if(!s||/^(https?:|data:|blob:)/i.test(s)||!TA||!D||!D.path)return;img.removeAttribute('src');
 TA.core.invoke('read_asset',{base:D.path,rel:s}).then(([mime,b])=>{img.src=`data:${mime};base64,${b}`}).catch(()=>{img.alt=(img.alt||s)+' (?)'})}
function buildToc(){const n=$('#toc');if(!toc.length){n.innerHTML=`<div class="none">${esc(t('noToc'))}</div>`;return}
 const min=Math.min(...toc.map(x=>x.l));
 n.innerHTML=toc.map((x,i)=>`<a class="ti" data-i="${i}" style="padding-left:${12+(x.l-min)*14}px" title="${esc(x.t)}">${esc(x.t)}</a>`).join('');spy()}
function spy(){const d=$('#doc'),y=d.scrollTop+90;let a=-1;toc.forEach((x,i)=>{if(x.el.offsetTop<=y)a=i});
 document.querySelectorAll('.ti').forEach((e,i)=>e.classList.toggle('on',i==a));
 const m=d.scrollHeight-d.clientHeight;$('#sPct').textContent=D?(m>0?Math.round(d.scrollTop/m*100):100)+'%':'';
 const on=$('.ti.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest'})}
$('#doc').addEventListener('scroll',spy,{passive:true});
$('#toc').onclick=e=>{const a=e.target.closest('.ti');if(a)toc[+a.dataset.i].el.scrollIntoView({behavior:'smooth',block:'start'})};
function resolve(base,rel){const sep=base.includes('\\')?'\\':'/',p=base.split(/[\\/]/);p.pop();for(const s of decodeURIComponent(rel).split('/')){if(s=='..')p.pop();else if(s&&s!='.')p.push(s)}return p.join(sep)}
$('#md').addEventListener('click',e=>{
 const cp=e.target.closest('.cp');
 if(cp){navigator.clipboard.writeText(cp.closest('.cb').querySelector('code').textContent).then(()=>{cp.textContent=t('copied');setTimeout(()=>cp.textContent=t('copy'),1200)}).catch(()=>toast(t('copyFail')));return}
 const a=e.target.closest('a[href]');if(!a)return;e.preventDefault();const h=a.getAttribute('href');
 if(h[0]=='#'){const el=document.getElementById(decodeURIComponent(h.slice(1)));if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(/^(https?:|mailto:|tel:)/i.test(h)){if(TA&&TA.opener)TA.opener.openUrl(h).catch(()=>{});else window.open(h,'_blank');return}
 if(D&&D.path&&/\.(md|markdown|mdown|mkd)(#.*)?$/i.test(h))openPath(resolve(D.path,h.split('#')[0]))});
/* ---------- documents ---------- */
function show(d,keep){const prev=keep?$('#doc').scrollTop:0;D=d;render(d.text);$('#empty').style.display='none';$('#fn').textContent=d.name;document.title=d.name+' · Readme Viewer';setWT(document.title);
 $('#bClose').disabled=false;$('#q').disabled=false;info();$('#doc').scrollTop=prev;spy();if($('#q').value)doFind()}
function closeDoc(){if(!D)return;D=null;toc=[];hits=[];$('#md').innerHTML='';$('#toc').innerHTML='';$('#empty').style.display='';$('#fn').textContent='';document.title='Readme Viewer';setWT('Readme Viewer');
 $('#bClose').disabled=true;$('#q').disabled=true;$('#q').value='';upd();info();$('#sPct').textContent=''}
async function openPath(p){try{show(await TA.core.invoke('read_doc',{path:p}))}catch(e){toast(t('readFail'))}}
async function pick(){if(TA){try{const p=await TA.dialog.open({multiple:false,filters:[{name:'Markdown',extensions:['md','markdown','mdown','mkd','txt']}]});if(p)openPath(p)}catch{toast(t('readFail'))}}else $('#file').click()}
function readBrowser(f){const r=new FileReader();r.onload=()=>show({path:'',name:f.name,size:f.size,mtime:0,text:String(r.result)});r.onerror=()=>toast(t('readFail'));r.readAsText(f)}
$('#bOpen').onclick=$('#bOpen2').onclick=pick;$('#bClose').onclick=closeDoc;

document.addEventListener('drop',e=>{e.preventDefault();$('#empty').classList.remove('drag');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f&&!TA)readBrowser(f)});

if(TA){document.body.classList.add('tw');
 TA.core.invoke('startup_doc').then(d=>d&&show(d)).catch(()=>{});
 TA.event.listen('open-doc',e=>show(e.payload));
 TA.event.listen('tauri://drag-enter',()=>$('#empty').classList.add('drag'));TA.event.listen('tauri://drag-leave',()=>$('#empty').classList.remove('drag'));
 TA.event.listen('tauri://drag-drop',e=>{$('#empty').classList.remove('drag');const p=e.payload&&e.payload.paths&&e.payload.paths[0];if(p)openPath(p)});
 setInterval(async()=>{if(!D||!D.path)return;try{const m=await TA.core.invoke('file_mtime',{path:D.path});if(m&&m!==D.mtime){show(await TA.core.invoke('read_doc',{path:D.path}),true);toast(t('reloaded'))}}catch{}},1500);
 const W=TA.window.getCurrentWindow();
 W.isDecorated().then(d=>{if(d)document.body.classList.add('native')}).catch(()=>{});
 $('#wMin').onclick=()=>W.minimize();$('#wMax').onclick=()=>W.toggleMaximize();$('#wClose').onclick=()=>W.close();
 const sync=()=>W.isMaximized().then(m=>{$('#wMax').textContent=m?'\uE923':'\uE922'}).catch(()=>{});W.onResized(sync);sync()}
/* ---------- find in document ---------- */
function clearMarks(){$('#md').querySelectorAll('mark.hit').forEach(m=>m.replaceWith(document.createTextNode(m.textContent)));$('#md').normalize();hits=[];cur=-1}
function upd(){$('#qc').textContent=!$('#q').value?'':hits.length?`${cur+1}/${hits.length}`:t('noMatch')}
function go(i){if(!hits.length){upd();return}if(hits[cur])hits[cur].classList.remove('cur');cur=(i+hits.length)%hits.length;hits[cur].classList.add('cur');if(hits[cur].scrollIntoView)hits[cur].scrollIntoView({block:'center'});upd()}
function doFind(){clearMarks();const q=$('#q').value;if(!q||!D){upd();return}
 const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),ns=[];
 const w=document.createTreeWalker($('#md'),NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest('.ch,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});let n;while(n=w.nextNode())ns.push(n);
 for(const n of ns){const s=n.nodeValue;re.lastIndex=0;let m,last=0,f=null;
  while((m=re.exec(s))){if(!m[0])break;f=f||document.createDocumentFragment();f.append(s.slice(last,m.index));const k=document.createElement('mark');k.className='hit';k.textContent=m[0];f.append(k);last=m.index+m[0].length}
  if(f){f.append(s.slice(last));n.replaceWith(f)}}
 hits=[...$('#md').querySelectorAll('mark.hit')];go(0)}
let ft;$('#q').oninput=()=>{clearTimeout(ft);ft=setTimeout(doFind,120)};
$('#q').onkeydown=e=>{if(e.key=='Enter'){e.preventDefault();go(cur+(e.shiftKey?-1:1))}if(e.key=='Escape'){e.target.value='';doFind();e.target.blur()}};
$('#qn').onclick=()=>go(cur+1);$('#qp').onclick=()=>go(cur-1);
