[package]
name = "material-video-player"
version = "1.0.0"
description = "Material Video Player - Material Design 3 video player for Windows"
authors = ["minhtrong67"]
edition = "2021"

[lib]
name = "material_video_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
base64 = "0.22"
encoding_rs = "0.8"
