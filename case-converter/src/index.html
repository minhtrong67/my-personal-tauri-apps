const t=k=>T[lang][k]||k;
/* ---------- theme + customizable accent color ---------- */
const PALETTE=['#0078D4','#0063B1','#8E8CD8','#6B69D6','#8764B8','#744DA9','#B146C2','#881798','#0099BC','#00B7C3','#038387','#00B294','#10893E','#498205','#FFB900','#F7630C','#DA3B01','#E81123','#EA005E','#E3008C'];
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const lum=([r,g,b])=>{const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(r)+.7152*f(g)+.0722*f(b)};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
function toHsl([r,g,b]){r/=255;g/=255;b/=255;const M=Math.max(r,g,b),m=Math.min(r,g,b);let h=0,s=0;const l=(M+m)/2;
 if(M!=m){const d=M-m;s=l>.5?d/(2-M-m):d/(M+m);h=M==r?(g-b)/d+(g<b?6:0):M==g?(b-r)/d+2:(r-g)/d+4;h*=60}return [h,s,l]}
function fromHsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return [f(0),f(8),f(4)]}
const hex=([r,g,b])=>'#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
function accentVars(h0){const [h,s0,l0]=toHsl(rgb(h0)),s=Math.min(s0,.95);
 let l=Math.min(l0,.5),c=fromHsl(h,s,l);while(contrast(c,[255,255,255])<4.6&&l>.06){l-=.02;c=fromHsl(h,s,l)}           // light theme: darker fill, white text
 let L=Math.max(l0,.58),d=fromHsl(h,s,L);while(contrast(d,[0,0,0])<8&&L<.92){L+=.02;d=fromHsl(h,s,L)}                // dark theme: lighter fill, black text
 return {'--bl':hex(c),'--bd':hex(d),'--ol':'#fff','--od':'#000'}}
function paint(){const r=document.documentElement;if(theme=='system')r.removeAttribute('data-theme');else r.dataset.theme=theme;
 const v=accentVars(accent);for(const k in v)r.style.setProperty(k,v[k]);
 try{TA&&TA.window.getCurrentWindow().setTheme(theme=='system'?null:theme)}catch{}}
/* ---------- UI ---------- */
let out='',tt;
function toast(m){const e=$('#sb');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2200)}
async function copyText(x){let ok=true;try{await navigator.clipboard.writeText(x)}catch{ok=false;const a=document.createElement('textarea');a.value=x;document.body.append(a);a.select();try{ok=document.execCommand('copy')}catch{}a.remove()}toast(t(ok?'copied':'copyFail'))}
function stats(s){const w=s.trim()?s.trim().split(/\s+/).length:0;$('#stat').textContent=`${[...s].length.toLocaleString()} ${t('chars')}  ·  ${w.toLocaleString()} ${t('wordsU')}  ·  ${s?lines(s).length:0} ${t('linesU')}`}
function chips(){const G={text:t('gText'),code:t('gCode'),other:t('gOther')};
 $('#chips').innerHTML=['text','code','other'].map(g=>`<div class="gl">${esc(G[g])}</div><div class="cg">`+CASES.filter(c=>c.g==g).map(c=>`<button class="btn${c.id==st.cse?' on':''}" data-c="${c.id}">${esc(nm(c))}</button>`).join('')+'</div>').join('');
 $('#tools').innerHTML=TOOLS.map(x=>`<button class="btn${x.id==st.tool?' on':''}" data-tool="${x.id}">${esc(nm(x))}</button>`).join('')}
function renderAll(s){const el=$('#list');if(!s){el.innerHTML=`<div class="empty">${esc(t('emptyAll'))}</div>`;return}
 const G={text:t('gText'),code:t('gCode'),other:t('gOther')};
 el.innerHTML=['text','code','other'].map(g=>`<div class="gl">${esc(G[g])}</div>`+CASES.filter(c=>c.g==g).map(c=>{const r=c.f(s),p=r.split(/\r?\n/)[0];
  return `<div class="row" data-c="${c.id}"><div class="rn">${esc(nm(c))}</div><div class="rv" title="${esc(p)}">${esc(p.length>140?p.slice(0,140)+'…':p)}${r.includes('\n')?' …':''}</div><span class="btn ic">${ico('copy')}</span></div>`}).join('')).join('')}
function update(){const s=$('#inp').value;stats(s);ls('draft',s);
 if(st.tab=='all'){out='';renderAll(s)}else if(st.tab=='tools'){const x=TOOLS.find(y=>y.id==st.tool);out=x?x.f(s):'';$('#out').value=out}
 else{out=CASES.find(c=>c.id==st.cse).f(s);$('#out').value=out}
 $('#bCopy').disabled=$('#bSwap').disabled=$('#bSave').disabled=!out}
function setTab(k){st.tab=k;ls('tab',k);$$('.tab').forEach(b=>{const on=b.dataset.tab==k;b.classList.toggle('on',on);b.setAttribute('aria-selected',on)});
 $('#vConvert').hidden=k!='convert';$('#vTools').hidden=k!='tools';$('#list').hidden=k!='all';$('#out').hidden=k=='all';
 $('#oTitle').textContent=t(k=='all'?'allTitle':k=='tools'?'toolsTitle':'result');update()}
function applyI18n(){document.documentElement.lang=lang;$$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $$('[data-t]').forEach(e=>{e.title=t(e.dataset.t);if(e.tagName=='TEXTAREA')e.placeholder=t(e.dataset.t)});chips();setTab(st.tab);if($('#dSet').open)setBody()}
function setBody(){const seg=(a,l,c)=>`<div class="seg">${l.map(([v,n])=>`<button ${a}="${v}" class="${v==c?'on':''}">${esc(n)}</button>`).join('')}</div>`;
 const cu=!PALETTE.some(p=>p.toLowerCase()==accent.toLowerCase());
 $('#setBody').innerHTML=`<h3>${esc(t('sTheme'))}</h3>${seg('data-th',[['system',t('system')],['light',t('light')],['dark',t('dark')]],theme)}<h3>${esc(t('sLang'))}</h3>${seg('data-lg',[['vi','Tiếng Việt'],['en','English']],lang)}
 <h3>${esc(t('sColor'))}</h3><div class="swr">${PALETTE.map(p=>`<button class="swc${p.toLowerCase()==accent.toLowerCase()?' on':''}" data-a="${p}" title="${p}" style="background:${p}">${ico('check')}</button>`).join('')}</div>
 <div class="swr" style="margin-top:6px;grid-template-columns:40px 1fr"><button class="swc cu${cu?' on':''}" data-custom title="${esc(t('custom'))}">${ico('check')}</button><div class="hex" style="margin:0;align-self:center">${esc(t('custom'))}: ${esc(accent.toUpperCase())}</div></div>`}
/* ---------- events ---------- */
$('#inp').oninput=update;
$('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;st.cse=b.dataset.c;ls('cse',st.cse);$$('#chips .btn').forEach(x=>x.classList.toggle('on',x==b));update()};
$('#tools').onclick=e=>{const b=e.target.closest('[data-tool]');if(!b)return;st.tool=b.dataset.tool;ls('tool',st.tool);$$('#tools .btn').forEach(x=>x.classList.toggle('on',x==b));update()};
$('#list').onclick=e=>{const r=e.target.closest('.row');if(r)copyText(CASES.find(c=>c.id==r.dataset.c).f($('#inp').value))};
$('#smart').checked=st.smart;$('#smart').onchange=e=>{st.smart=e.target.checked;ls('smart',st.smart?'1':'0');update()};
$$('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#bCopy').onclick=()=>out&&copyText(out);
function clearAll(){$('#inp').value='';update();$('#inp').focus()}
$('#bClear').onclick=clearAll;
$('#bSwap').onclick=()=>{if(!out)return;$('#inp').value=out;update();toast(t('swapped'))};
$('#bPaste').onclick=async()=>{try{const x=await navigator.clipboard.readText();$('#inp').value=x;update();$('#inp').focus()}catch{toast(t('pasteFail'))}};
$('#bSave').onclick=async()=>{if(!out)return;if(TA){try{if(await TA.core.invoke('save_text',{name:'result.txt',text:out}))toast(t('saved'))}catch{toast(t('copyFail'))}}
 else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/plain'}));a.download='result.txt';a.click();toast(t('saved'))}};
function setInput(x){$('#inp').value=x;update()}
async function readPath(p){try{setInput(await TA.core.invoke('read_text',{path:p}))}catch{toast(t('readFail'))}}
$('#bOpen').onclick=async()=>{if(TA){try{const p=await TA.dialog.open({multiple:false,filters:[{name:'Text',extensions:['txt','md','csv','log','json']}]});if(p)readPath(p)}catch{toast(t('readFail'))}}else $('#file').click()};
$('#file').onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=()=>setInput(String(r.result));r.readAsText(f)}e.target.value=''};
$('#bSet').onclick=()=>{setBody();$('#dSet').showModal()};$('#bAbout').onclick=()=>$('#dAbout').showModal();
$$('[data-close]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('#setBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.th){theme=b.dataset.th;ls('theme',theme);paint()}else if(b.dataset.lg){lang=b.dataset.lg;ls('lang',lang);applyI18n()}
 else if(b.dataset.a){accent=b.dataset.a;ls('accent',accent);paint()}else if('custom' in b.dataset){$('#cc').value=accent.toLowerCase();$('#cc').click();return}setBody()};
$('#cc').oninput=e=>{accent=e.target.value;ls('accent',accent);paint();setBody()};
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(e.ctrlKey&&e.shiftKey&&k=='c'){e.preventDefault();out&&copyText(out)}else if(e.ctrlKey&&e.shiftKey&&k=='x'){e.preventDefault();clearAll()}
 else if(e.altKey&&'123'.includes(e.key)&&e.key.length==1){e.preventDefault();setTab(['convert','all','tools'][+e.key-1])}});
if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{});
if(TA){document.body.classList.add('tw');
 TA.event.listen('tauri://drag-drop',e=>{const p=e.payload&&e.payload.paths&&e.payload.paths[0];if(p)readPath(p)});
 const W=TA.window.getCurrentWindow();
 W.isDecorated().then(d=>{if(d)document.body.classList.add('native')}).catch(()=>{});
 $('#wMin').onclick=()=>W.minimize();$('#wMax').onclick=()=>W.toggleMaximize();$('#wClose').onclick=()=>W.close();
 const sync=()=>W.isMaximized().then(m=>{$('#wMax').textContent=m?'\uE923':'\uE922'}).catch(()=>{});W.onResized(sync);sync()}
$('#inp').value=ls('draft')||'';paint();applyI18n();
</script></body></html>
