<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fef7ff" />
  <title>Material Edit</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l4 6M21 9l-4 6"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3h-4v8a2 2 0 0 1-4 0V3zM6 7h4M14 7h4"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 12h6M14 12h6M7 9l-3 3 3 3M17 9l3 3-3 3"/></symbol>
    <symbol id="i-fullscreen" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M4 15v5h5M20 15v5h-5"/></symbol>

    <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM7 3v5h8V3M7 21v-7h10v7"/></symbol>
    <symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h8M20 7h-4M4 17h4M20 17H12"/><circle cx="14" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></symbol>

    <symbol id="i-rotate" viewBox="0 0 24 24"><path d="M4 4v6h6M20 20v-6h-6M5.5 15a7 7 0 0 0 12 2.5M18.5 9A7 7 0 0 0 6.5 6.5"/></symbol>

    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 10v10h4v-6h4v6h4V10"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></symbol>

    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>

    <symbol id="i-paste" viewBox="0 0 24 24"><rect x="6" y="5" width="12" height="16" rx="2"/><path d="M9 5V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/></symbol>
    <symbol id="i-cut" viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.5"/><circle cx="6" cy="17" r="2.5"/><path d="M8 8.5l12 9M8 15.5l12-9"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="M4 7h10M4 12h7M4 17h4M17 6v12M14 15l3 3 3-3"/></symbol>
    <symbol id="i-cloud-check" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 9.5 4 4 0 0 1 17.5 18zM9 13l2.2 2.2L15.5 11"/></symbol>
    <symbol id="i-play-fill" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></symbol>
  </svg>

  <div id="app">
    <header class="top-bar">
      <button class="icon-btn" id="btn-menu" data-i18n-title="menu.file" aria-haspopup="menu"><svg class="i"><use href="#i-menu"/></svg></button>
      <button class="icon-btn" id="btn-home" data-i18n-title="tip.home"><svg class="i"><use href="#i-home"/></svg></button>
      <div class="doc-title">
        <input id="proj-name" type="text" spellcheck="false" maxlength="100" data-i18n-ph="project.untitled" aria-label="Project name" />
        <span id="dirty-dot" class="dirty-dot" hidden></span>
      </div>
      <div class="spacer"></div>
      <span class="save-status" id="save-status" role="status"></span>
      <button class="icon-btn" id="btn-undo" data-i18n-title="tip.undo"><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="icon-btn" id="btn-redo" data-i18n-title="tip.redo"><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="icon-btn" id="btn-theme" data-i18n-title="tip.theme"><svg class="i"><use id="theme-use" href="#i-auto"/></svg></button>
      <button class="icon-btn" id="btn-shortcuts" data-i18n-title="tip.shortcuts"><svg class="i"><use href="#i-keyboard"/></svg></button>
      <button class="icon-btn" id="btn-settings" data-i18n-title="tip.settings"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="btn filled" id="btn-export"><svg class="i"><use href="#i-export"/></svg><span data-i18n="export.button"></span></button>
    </header>

    <div class="menu" id="file-menu" role="menu" hidden>
      <button class="menu-item" role="menuitem" data-act="new"><svg class="i"><use href="#i-new"/></svg><span data-i18n="file.new"></span><kbd>Ctrl+N</kbd></button>
      <button class="menu-item" role="menuitem" data-act="home"><svg class="i"><use href="#i-home"/></svg><span data-i18n="file.projects"></span><kbd>Ctrl+Shift+H</kbd></button>
      <button class="menu-item" role="menuitem" data-act="open"><svg class="i"><use href="#i-open"/></svg><span data-i18n="file.open"></span><kbd>Ctrl+O</kbd></button>
      <div class="menu-sep"></div>
      <button class="menu-item" role="menuitem" data-act="save"><svg class="i"><use href="#i-save"/></svg><span data-i18n="file.save"></span><kbd>Ctrl+S</kbd></button>
      <button class="menu-item" role="menuitem" data-act="saveas"><svg class="i"><use href="#i-export"/></svg><span data-i18n="file.saveAs"></span><kbd>Ctrl+Shift+S</kbd></button>
      <div class="menu-sep"></div>
      <button class="menu-item" role="menuitem" data-act="import"><svg class="i"><use href="#i-film"/></svg><span data-i18n="file.import"></span><kbd>Ctrl+I</kbd></button>
      <button class="menu-item" role="menuitem" data-act="export"><svg class="i"><use href="#i-export"/></svg><span data-i18n="file.export"></span><kbd>Ctrl+E</kbd></button>
      <div class="menu-sep"></div>
      <button class="menu-item" role="menuitem" data-act="shortcuts"><svg class="i"><use href="#i-keyboard"/></svg><span data-i18n="file.shortcuts"></span><kbd>Ctrl+/</kbd></button>
      <button class="menu-item" role="menuitem" data-act="exit"><svg class="i"><use href="#i-close"/></svg><span data-i18n="file.exit"></span></button>
    </div>

    <div id="workbench">
      <aside id="left">
        <nav class="rail" id="rail">
          <button data-tab="media" class="on"><svg class="i"><use href="#i-film"/></svg><span data-i18n="tab.media"></span></button>
          <button data-tab="text"><svg class="i"><use href="#i-text"/></svg><span data-i18n="tab.text"></span></button>
          <button data-tab="effects"><svg class="i"><use href="#i-wand"/></svg><span data-i18n="tab.effects"></span></button>
          <button data-tab="transitions"><svg class="i"><use href="#i-swap"/></svg><span data-i18n="tab.transitions"></span></button>
        </nav>
        <section id="left-body"></section>
      </aside>

      <div class="splitter v" id="sp-left" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="tip.resize"></div>

      <section id="center">
        <div id="stage"><div id="canvas-wrap"><canvas id="cv"></canvas><canvas id="cv-ov"></canvas><div id="empty-hint"><svg class="i"><use href="#i-film"/></svg><p data-i18n="empty.hint"></p></div></div></div>
        <div class="seek-wrap"><input type="range" id="tp-seek" class="seek" min="0" max="1000" step="1" value="0" aria-label="Seek" /></div>
        <div class="transport">
          <span id="time-cur" class="time">00:00.00</span>
          <div class="spacer"></div>
          <button class="icon-btn" id="tp-first" data-i18n-title="tip.first"><svg class="i"><use href="#i-first"/></svg></button>
          <button class="icon-btn" id="tp-back" data-i18n-title="tip.stepBack"><svg class="i"><use href="#i-back"/></svg></button>
          <button class="icon-btn play" id="tp-play" data-i18n-title="tip.play"><svg class="i"><use id="play-use" href="#i-play"/></svg></button>
          <button class="icon-btn" id="tp-fwd" data-i18n-title="tip.stepFwd"><svg class="i"><use href="#i-fwd"/></svg></button>
          <button class="icon-btn" id="tp-last" data-i18n-title="tip.last"><svg class="i"><use href="#i-last"/></svg></button>
          <div class="spacer"></div>
          <button class="icon-btn sm" id="tp-mute" data-i18n-title="tip.volume"><svg class="i"><use id="mute-use" href="#i-vol"/></svg></button>
          <input type="range" id="tp-vol" min="0" max="1" step="0.05" value="1" aria-label="Volume" />
          <span id="time-tot" class="time dim">00:00.00</span>
          <button class="icon-btn sm" id="tp-full" data-i18n-title="tip.fullscreen"><svg class="i"><use id="full-use" href="#i-fullscreen"/></svg></button>
        </div>
      </section>

      <div class="splitter v" id="sp-right" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-title="tip.resize"></div>

      <aside id="right"><div id="inspector"></div></aside>
    </div>
    <div class="splitter h" id="sp-tl" role="separator" aria-orientation="horizontal" tabindex="0" data-i18n-title="tip.resize"></div>

    <section id="timeline">
      <div class="tl-toolbar">
        <button class="icon-btn sm" id="tl-split" data-i18n-title="tip.split"><svg class="i"><use href="#i-split"/></svg></button>
        <button class="icon-btn sm" id="tl-dup" data-i18n-title="tip.duplicate"><svg class="i"><use href="#i-copy"/></svg></button>
        <button class="icon-btn sm" id="tl-del" data-i18n-title="tip.delete"><svg class="i"><use href="#i-trash"/></svg></button>
        <button class="icon-btn sm toggle" id="tl-snap" data-i18n-title="tip.snap"><svg class="i"><use href="#i-magnet"/></svg></button>
        <div class="spacer"></div>
        <button class="icon-btn sm" id="tl-zout" data-i18n-title="tip.zoomOut"><svg class="i"><use href="#i-minus"/></svg></button>
        <input type="range" id="tl-zoom" min="0" max="100" step="1" value="40" aria-label="Timeline zoom" />
        <button class="icon-btn sm" id="tl-zin" data-i18n-title="tip.zoomIn"><svg class="i"><use href="#i-plus"/></svg></button>
        <button class="icon-btn sm" id="tl-fit" data-i18n-title="tip.fit"><svg class="i"><use href="#i-fit"/></svg></button>
      </div>
      <div id="tl-scroll"><div id="tl-content"></div></div>
    </section>
  </div>

  <input type="file" id="file-import" multiple accept="video/*,audio/*,image/*,.mkv,.mov,.m4v,.flac,.opus" hidden />
  <input type="file" id="file-project" accept=".medit,.mvep,application/json" hidden />

  <dialog id="dlg-settings" class="dialog wide">
    <h2 data-i18n="settings.title"></h2>
    <div class="dlg-body">
      <section>
        <h3 data-i18n="settings.theme"></h3>
        <div class="segmented" id="seg-theme">
          <button data-mode="light"><svg class="i"><use href="#i-sun"/></svg><span data-i18n="theme.light"></span></button>
          <button data-mode="dark"><svg class="i"><use href="#i-moon"/></svg><span data-i18n="theme.dark"></span></button>
          <button data-mode="system"><svg class="i"><use href="#i-auto"/></svg><span data-i18n="theme.system"></span></button>
        </div>
      </section>
      <section>
        <h3 data-i18n="settings.accent"></h3>
        <div class="swatches" id="swatches"></div>
        <label class="custom-color"><input type="color" id="inp-seed" value="#6750a4" /><span data-i18n="settings.customColor"></span><code id="seed-hex">#6750A4</code></label>
      </section>
      <section>
        <h3 data-i18n="settings.language"></h3>
        <select id="sel-lang" class="select block">
          <option value="auto" data-i18n="lang.auto"></option>
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
        </select>
      </section>
      <section>
        <h3 data-i18n="settings.window"></h3>
        <select id="sel-start" class="select block">
          <option value="remember" data-i18n="start.remember"></option>
          <option value="maximized" data-i18n="start.maximized"></option>
          <option value="fullscreen" data-i18n="start.fullscreen"></option>
        </select>
        <p class="hint" data-i18n="settings.windowHint"></p>
      </section>
      <section id="sec-exdir">
        <h3 data-i18n="settings.exportDir"></h3>
        <div class="dir-row">
          <input class="field" id="inp-exdir" type="text" readonly data-i18n-ph="settings.exportDirNone" />
          <button class="btn tonal sm" id="btn-exdir"><svg class="i"><use href="#i-open"/></svg><span data-i18n="settings.choose"></span></button>
          <button class="icon-btn sm" id="btn-exdir-clear" data-i18n-title="btn.clear"><svg class="i"><use href="#i-close"/></svg></button>
        </div>
        <p class="hint" data-i18n="settings.exportDirHint"></p>
      </section>
      <section>
        <h3 data-i18n="settings.preview"></h3>
        <label class="switch-row"><span data-i18n="settings.proxy"></span><span class="switch"><input type="checkbox" id="chk-proxy" /><i></i></span></label>
        <p class="hint" data-i18n="settings.proxyHint"></p>
      </section>
      <section>
        <h3 data-i18n="settings.reset"></h3>
        <div class="btn-row">
          <button class="chip-btn" id="btn-reset-layout"><svg class="i"><use href="#i-rotate"/></svg><span data-i18n="settings.resetLayout"></span></button>
          <button class="chip-btn" id="btn-reset-export"><svg class="i"><use href="#i-rotate"/></svg><span data-i18n="settings.resetExport"></span></button>
        </div>
      </section>
      <section class="about">
        <h3 data-i18n="settings.about"></h3>
        <p><strong>Material Edit</strong> 1.0.0</p>
        <p data-i18n="about.credit"></p>
      </section>
    </div>
    <div class="dlg-actions"><button class="btn text" data-close data-i18n="btn.done"></button></div>
  </dialog>

  <dialog id="dlg-export" class="dialog wide">
    <h2 data-i18n="export.title"></h2>
    <div class="dlg-body" id="export-body"></div>
    <div class="dlg-actions" id="export-actions"></div>
  </dialog>

  <dialog id="dlg-confirm" class="dialog">
    <h2 id="cf-title"></h2>
    <div class="dlg-body"><p id="cf-msg"></p></div>
    <div class="dlg-actions">
      <button class="btn text" id="cf-cancel" data-i18n="btn.cancel"></button>
      <span class="spacer"></span>
      <button class="btn text" id="cf-no"></button>
      <button class="btn filled" id="cf-yes"></button>
    </div>
  </dialog>

  <div id="home" hidden>
    <header class="home-bar">
      <img class="logo" src="assets/logo.png" alt="" width="36" height="36" />
      <h1>Material Edit</h1>
      <div class="spacer"></div>
      <button class="icon-btn" id="home-theme" data-i18n-title="tip.theme"><svg class="i"><use id="home-theme-use" href="#i-auto"/></svg></button>
      <button class="icon-btn" id="home-shortcuts" data-i18n-title="tip.shortcuts"><svg class="i"><use href="#i-keyboard"/></svg></button>
      <button class="icon-btn" id="home-settings" data-i18n-title="tip.settings"><svg class="i"><use href="#i-gear"/></svg></button>
    </header>
    <div class="home-body" id="home-body">
      <section class="home-hero">
        <div>
          <h2 data-i18n="home.title"></h2>
          <p data-i18n="home.sub"></p>
        </div>
        <div class="hero-actions">
          <button class="btn tonal" id="home-open"><svg class="i"><use href="#i-open"/></svg><span data-i18n="file.open"></span></button>
          <button class="btn filled big" id="home-new"><svg class="i"><use href="#i-plus"/></svg><span data-i18n="file.new"></span></button>
        </div>
      </section>
      <div class="home-tools">
        <label class="search"><svg class="i"><use href="#i-search"/></svg><input id="home-search" type="search" autocomplete="off" spellcheck="false" data-i18n-ph="home.search" /></label>
        <select id="home-sort" class="select" aria-label="Sort">
          <option value="recent" data-i18n="home.sort.recent"></option>
          <option value="name" data-i18n="home.sort.name"></option>
          <option value="duration" data-i18n="home.sort.duration"></option>
        </select>
        <div class="segmented small icons" id="home-view">
          <button data-view="grid" data-i18n-title="home.grid"><svg class="i"><use href="#i-grid"/></svg></button>
          <button data-view="list" data-i18n-title="home.list"><svg class="i"><use href="#i-list"/></svg></button>
        </div>
      </div>
      <div id="home-list" class="proj-grid"></div>
      <div id="home-empty" class="home-empty" hidden>
        <svg class="i"><use href="#i-film"/></svg>
        <h3 data-i18n="home.emptyTitle"></h3>
        <p data-i18n="home.emptyText"></p>
      </div>
    </div>
  </div>

  <dialog id="dlg-prompt" class="dialog">
    <h2 id="pr-title"></h2>
    <div class="dlg-body"><input class="field" id="pr-input" type="text" maxlength="100" spellcheck="false" /></div>
    <div class="dlg-actions">
      <button class="btn text" id="pr-cancel" data-i18n="btn.cancel"></button>
      <button class="btn filled" id="pr-ok" data-i18n="btn.ok"></button>
    </div>
  </dialog>

  <dialog id="dlg-shortcuts" class="dialog wide">
    <h2 data-i18n="shortcuts.title"></h2>
    <div class="dlg-body" id="shortcuts-body"></div>
    <div class="dlg-actions"><button class="btn text" data-close data-i18n="btn.done"></button></div>
  </dialog>

  <div id="drop-overlay" hidden><div><svg class="i"><use href="#i-film"/></svg><p data-i18n="drop.hint"></p></div></div>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
