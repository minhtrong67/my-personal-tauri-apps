<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">

<style>
/* Fluent 2 / WinUI 3 tokens (Windows 11). light-dark() follows color-scheme. */
:root{color-scheme:light dark;--mica:light-dark(#f3f3f3,#202020);--surf:light-dark(#fff,#272727);--surf2:light-dark(#fafafa,#2c2c2c);--bg:var(--mica);
--fg:light-dark(#1a1a1a,#fff);--fg2:light-dark(rgba(0,0,0,.62),rgba(255,255,255,.79));
--line:light-dark(rgba(0,0,0,.09),rgba(255,255,255,.09));--stroke:light-dark(rgba(0,0,0,.06),rgba(255,255,255,.07));--strokeb:light-dark(rgba(0,0,0,.16),rgba(255,255,255,.1));
--ctl:light-dark(#fff,rgba(255,255,255,.06));--ctlh:light-dark(#f9f9f9,rgba(255,255,255,.084));
--hov:light-dark(rgba(0,0,0,.037),rgba(255,255,255,.061));--press:light-dark(rgba(0,0,0,.024),rgba(255,255,255,.042));
--brand:light-dark(#005fb8,#60cdff);--brandh:color-mix(in srgb,var(--brand) 88%,var(--surf));--onb:light-dark(#fff,#000);
--sel:color-mix(in srgb,var(--brand) 10%,transparent);--rowh:light-dark(#f3f3f3,#323232);--rows:light-dark(#e5f0fa,#1c3a52);--zebra:light-dark(#fafafa,#2b2b2b);
--c1:var(--brand);--c2:light-dark(#0f7b0f,#6ccb5f);--c3:light-dark(#9d5d00,#fce100);--c4:light-dark(#c42b1c,#ff99a4);--r:4px;box-sizing:border-box}
:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/20px "Segoe UI Variable Text","Segoe UI Variable","Segoe UI",system-ui,sans-serif;color:var(--fg);background:var(--mica);display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;flex:none}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-thumb{background:light-dark(rgba(0,0,0,.45),rgba(255,255,255,.5));border-radius:8px;border:5px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{border-width:3px}::-webkit-scrollbar-corner{background:transparent}
.title{display:flex;align-items:center;gap:8px;height:32px;flex:none;padding:0 0 0 16px;font-size:12px;min-width:0}
.title b{font-weight:600}.title span{color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title span:not(:empty)::before{content:"|";margin-right:8px;opacity:.4}
.lg{width:18px;height:18px;stroke:none}body.native .title{display:none}.wc{display:none;margin-left:auto;align-self:stretch}body.tw .wc{display:flex}
.wc button{width:46px;border:0;background:transparent;color:var(--fg);font:10px "Segoe Fluent Icons","Segoe MDL2 Assets";cursor:default}.wc button:hover{background:var(--hov)}.wc #wClose:hover{background:#c42b1c;color:#fff}
.title *{pointer-events:none}.title .wc,.title .wc *{pointer-events:auto}
.bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px;flex:none;padding:8px 12px}
.sp{flex:1}.sep{width:1px;height:20px;background:var(--line);margin:0 4px}
button,select,input{font:inherit;color:inherit}
.btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:var(--r);background:var(--ctl);color:var(--fg);cursor:pointer;white-space:nowrap;transition:background .1s}
.btn:hover{background:var(--ctlh)}.btn:active{background:var(--press);color:var(--fg2);border-bottom-color:var(--stroke)}.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--onb);font-weight:600;margin-right:4px}.btn.pri:hover{background:var(--brandh)}.btn.pri:active{background:color-mix(in srgb,var(--brand) 78%,var(--surf))}
.btn.ic{width:32px;padding:0;justify-content:center;border-color:transparent;background:transparent}.btn.ic:hover{background:var(--hov)}.btn.ic:active{background:var(--press)}
.btn.t svg{color:var(--c)}.copy{--c:var(--c1)}.exp{--c:var(--c2)}.flt{--c:var(--c3)}.cls{--c:var(--c4)}
:focus-visible{outline:2px solid var(--fg);outline-offset:1px}
.srch{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px 0 10px;width:min(360px,40%);min-width:170px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:var(--r);background:var(--ctl);color:var(--fg2)}
.srch:focus-within{background:var(--surf);border-bottom:2px solid var(--brand)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--fg)}.srch input::placeholder{color:var(--fg2)}
select{height:32px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:var(--r);background:var(--ctl);padding:0 6px;cursor:pointer}
.srch select,.status select{border:0;background:transparent;color:var(--fg2);height:24px;max-width:130px}.srch select:hover,.status select:hover{background:var(--hov)}
option{background:var(--surf);color:var(--fg)}
.in{height:32px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:var(--r);background:var(--ctl);padding:0 8px}.in:focus{outline:0;border-bottom:2px solid var(--brand)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;white-space:nowrap}
.sw input{appearance:none;width:40px;height:20px;border-radius:10px;border:1px solid var(--fg2);background:transparent;position:relative;margin:0;cursor:pointer;transition:.1s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:var(--fg2);transition:.1s}
.sw input:hover::after{width:14px;height:14px;top:2px}
.sw input:checked{background:var(--brand);border-color:var(--brand)}.sw input:checked::after{left:22px;background:var(--onb)}
.bdg{background:var(--brand);color:var(--onb);border-radius:9px;min-width:18px;height:18px;padding:0 5px;font-size:12px;line-height:18px;text-align:center}
.seg{display:flex;padding:2px;gap:2px;border-radius:6px;background:var(--hov);margin-right:4px}.seg.off{opacity:.4;pointer-events:none}
.seg button{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:0;border-radius:4px;background:transparent;color:var(--fg2);cursor:pointer}
.seg button:hover{color:var(--fg)}.seg button.on{background:var(--surf);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.14)}.seg button.on svg{color:var(--brand)}
#ctl{margin:0 12px 8px;border:1px solid var(--stroke);border-radius:8px;background:var(--surf);flex:none;overflow:hidden}#ctl[hidden]{display:none}
.cols-row{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid var(--line)}.lbl{font-weight:600}
#colchips{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;padding:2px 0}
.cc{height:28px;padding:0 12px;border-radius:var(--r);border:1px solid var(--stroke);border-bottom-color:var(--strokeb);background:var(--ctl);color:var(--fg2);cursor:pointer;white-space:nowrap;text-decoration:line-through}.cc:hover{background:var(--ctlh)}
.cc.on{background:var(--brand);border-color:var(--brand);color:var(--onb);text-decoration:none}
.lnk{border:0;background:none;color:var(--brand);cursor:pointer;white-space:nowrap}.lnk:hover{text-decoration:underline}
#acc summary{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;cursor:pointer;list-style:none;user-select:none}#acc summary:hover{background:var(--hov)}
#acc summary::-webkit-details-marker{display:none}
#acc summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:1.5px solid var(--fg2);border-bottom:1.5px solid var(--fg2);transform:rotate(45deg) translateY(-2px);transition:.15s}
#acc[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
#acc summary .btn{border:0;background:transparent;padding:0;height:auto;font-weight:600;pointer-events:none}
#chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--sel);color:var(--brand);font-size:12px;cursor:pointer}
#fbody{padding:12px 16px;border-top:1px solid var(--line)}.fr{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.fr .in{min-width:0}.fr input.in{width:160px}.fr .btn{width:32px;justify-content:center;padding:0}
main{flex:1;min-height:0;min-width:0;display:flex;position:relative;margin:0 12px;border:1px solid var(--stroke);border-radius:8px;background:var(--surf);overflow:hidden}
#grid{flex:1;overflow:auto;min-width:0}
table{border-collapse:separate;border-spacing:0;table-layout:fixed;min-width:100%}
th,td{height:36px;padding:0 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--surf2);font-weight:600;cursor:pointer;user-select:none;z-index:1}th:hover{background:var(--rowh)}.ar{margin-left:6px;color:var(--brand)}
.rn{position:sticky;left:0;width:56px;color:var(--fg2);font-size:12px;text-align:right;background:var(--surf);z-index:2}th.rn{z-index:3;background:var(--surf2)}
tbody tr:nth-child(even) td{background:var(--zebra)}tbody tr:hover td{background:var(--rowh)}tbody tr.sel td{background:var(--rows)}
tbody tr.sel .rn{color:var(--fg)}tbody tr.sel .rn::before{content:"";position:absolute;left:4px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--brand)}
th.ft{top:36px;height:40px;padding:4px 6px;z-index:1;background:var(--surf);cursor:default}
th.ft input{width:100%;height:28px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:var(--r);background:var(--ctl);padding:0 8px;font:inherit;font-weight:400;color:var(--fg);outline:0}th.ft input:focus{border-bottom:2px solid var(--brand)}
.rz{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:4}.rz:hover,.rz.on{background:var(--brand);opacity:.5}
.none{padding:64px 0;text-align:center;color:var(--fg2);position:sticky;left:0}
#det{width:320px;border-left:1px solid var(--line);overflow:auto;padding:20px;flex:none;background:var(--surf)}#det.off{display:none}
#det h3{margin:0 0 12px;font-size:20px;line-height:28px;font-weight:600}
.kv{padding:10px 0;border-bottom:1px solid var(--line)}.kv small{display:block;color:var(--fg2);font-size:12px;line-height:16px}.kv div{word-break:break-word;user-select:text}
#empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:var(--surf)}#empty.drag{background:var(--sel);outline:2px dashed var(--brand);outline-offset:-12px}
#empty .lg{width:64px;height:64px}#empty h2{margin:16px 0 4px;font-size:20px;line-height:28px;font-weight:600}#empty p{margin:0 0 20px;color:var(--fg2)}
#empty .row{display:flex;gap:8px;justify-content:center}#empty .btn{padding:0 20px}#empty .btn.pri{margin:0}
kbd{font:inherit;font-size:12px;border:1px solid var(--stroke);border-bottom-color:var(--strokeb);border-radius:4px;padding:0 6px;background:var(--ctl);color:var(--fg2)}
.status{display:flex;align-items:center;gap:12px;height:32px;flex:none;padding:0 16px;font-size:12px;line-height:16px;color:var(--fg2);white-space:nowrap;overflow:hidden}
#sInfo,#sSel{overflow:hidden;text-overflow:ellipsis;min-width:0}.status>:not(#sInfo):not(#sSel):not(.sp){flex:none}
.status .btn{height:24px;width:24px;padding:0;justify-content:center;border-color:transparent;background:transparent;color:var(--fg2)}.status .btn:hover{background:var(--hov)}
.pop{position:fixed;z-index:20;background:var(--surf);border:1px solid var(--stroke);border-radius:8px;box-shadow:0 8px 16px rgba(0,0,0,.14);padding:4px;min-width:180px;max-width:96vw;max-height:70vh;overflow:auto}.pop[hidden]{display:none}
.pop .btn{width:100%;justify-content:flex-start;border-color:transparent;background:transparent}.pop .btn:hover{background:var(--hov)}
.cards{display:grid;gap:12px;padding:16px;align-content:start}.cards.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.cards.col{grid-template-columns:minmax(0,1fr);max-width:760px;margin:0 auto}
.card{border:1px solid var(--stroke);border-radius:8px;padding:12px 16px;background:var(--surf2);min-width:0;transition:background .1s;cursor:default}
.card:hover{background:var(--rowh)}.card.sel{border-color:var(--brand);background:var(--rows)}
.card header{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.card header b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card header span{color:var(--fg2);font-size:12px}
.card .f{display:flex;flex-direction:column;padding:6px 0;border-top:1px solid var(--line);min-width:0}.card .f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card small{color:var(--fg2);font-size:12px;line-height:16px}.cards.col .f{flex-direction:row;gap:12px}.cards.col .f small{width:160px;flex:none;line-height:20px}
dialog{border:1px solid var(--stroke);border-radius:8px;background:var(--surf);color:var(--fg);padding:24px;width:min(400px,92vw);text-align:left;box-shadow:0 32px 64px rgba(0,0,0,.28)}
dialog::backdrop{background:rgba(0,0,0,.3)}#aboutOk{margin:20px 0 0 auto!important}dialog .lg{display:block}
#toast{position:fixed;left:50%;bottom:48px;transform:translateX(-50%) translateY(8px);background:var(--surf);color:var(--fg);border:1px solid var(--stroke);padding:10px 16px;border-radius:var(--r);box-shadow:0 8px 16px rgba(0,0,0,.14);opacity:0;pointer-events:none;transition:.2s}
#toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:1000px){.bar .btn:not(.pri):not(.ic){font-size:0;gap:0;width:32px;padding:0;justify-content:center}.seg span{display:none}}
@media(max-width:900px){#det{position:absolute;right:0;top:0;bottom:0;z-index:5;box-shadow:-8px 0 16px rgba(0,0,0,.14)}}
@media(max-width:760px){.srch{order:9;flex:1 0 100%;width:100%}#sSel,#ps{display:none}}
@media(max-width:560px){.cards.col .f{flex-direction:column;gap:0}.cards.grid{grid-template-columns:minmax(0,1fr)}}
</style></head><body>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=L(m);t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

function detect(t){const l=t.split(/\r?\n/)[0]||'';let b=',',m=0;for(const d of [',',';','\t','|']){const c=l.split(d).length;if(c>m){m=c;b=d}}return b}
function parse(t,d){const R=[];let r=[],c='',q=false;
for(let i=0;i<t.length;i++){const ch=t[i];
if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
else if(ch=='"')q=true;else if(ch==d){r.push(c);c=''}
else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
if(c!==''||r.length){r.push(c);R.push(r)}
return R.filter(x=>x.length>1||x[0]!=='')}

function build(){
 let t=S.raw.replace(/^\uFEFF/,''),sel=$('#dl').value;
 const d=sel=='auto'?detect(t):sel;
 const R=parse(t,d),w=Math.max(0,...R.map(r=>r.length));
 R.forEach(r=>{while(r.length<w)r.push('')});
 const hh=$('#hh').checked;
 S.head=hh&&R.length?R[0]:Array.from({length:w},(_,i)=>cn(i));
 S.rows=hh?R.slice(1):R;S.sc=-1;S.sel=-1;S.hid=new Set();S.flt=[];fcount();
 S.num=S.head.map((_,c)=>{const v=S.rows.slice(0,300).map(r=>r[c]).filter(x=>x!=='');return v.length>0&&v.every(x=>isFinite(x))});
 S.cf={};S.w=S.head.map((h,c)=>{let m=String(h).length;for(const r of S.rows.slice(0,60))m=Math.max(m,String(r[c]).length);return Math.max(96,Math.min(360,m*8+40))});fltUI();colUI();
 $('#qc').innerHTML='<option value="-1">Tất cả cột</option>'+S.head.map((h,i)=>`<option value="${i}">${esc(h||cn(i))}</option>`).join('');
 apply();showDet()}

function load(text,name,size){
 S.raw=text;S.name=name;S.size=size;$('#fn').textContent='— '+name;document.title=name+' · CSV Viewer';setWT(document.title);

 $('#empty').style.display='none';$('#ctl').hidden=false;$('#seg').classList.remove('off');if(innerWidth<900)$('#det').classList.add('off');build()}

function cmp(a,b){const x=parseFloat(a),y=parseFloat(b);
 if(a!==''&&b!==''&&isFinite(a)&&isFinite(b))return x-y;
 return String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'})}

function apply(keepPage){
 const q=$('#q').value.trim().toLowerCase(),c=+$('#qc').value;
 let v=S.rows.map((_,i)=>i);
 if(q)v=v.filter(i=>{const r=S.rows[i];return c<0?r.some(x=>x.toLowerCase().includes(q)):(r[c]||'').toLowerCase().includes(q)});
 const af=S.flt.filter(f=>f.o=="em"||f.o=="ne"||f.v!=="");if(af.length)v=v.filter(i=>af.every(f=>test(S.rows[i][f.c],f)));
 const cf=Object.entries(S.cf).filter(([,t])=>t);if(cf.length)v=v.filter(i=>cf.every(([c,t])=>String(S.rows[i][c]).toLowerCase().includes(t.toLowerCase())));
 if(S.sc>=0)v.sort((a,b)=>S.sd*cmp(S.rows[a][S.sc],S.rows[b][S.sc])||a-b);
 S.view=v;if(!keepPage)S.page=0;render()}

function fmtSize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?(n/1024).toFixed(1)+' KB':n+' B'}
function render(){
 const pages=Math.max(1,Math.ceil(S.view.length/S.ps));S.page=Math.min(S.page,pages-1);
 const st=S.page*S.ps,sl=S.view.slice(st,st+S.ps);
 const vis=S.head.map((_,i)=>i).filter(i=>!S.hid.has(i));
 let h=`<table style="width:${56+vis.reduce((a,i)=>a+S.w[i],0)}px"><colgroup><col style="width:56px">${vis.map(i=>`<col data-k="${i}" style="width:${S.w[i]}px">`).join('')}</colgroup><thead><tr><th class="rn">#</th>${vis.map(i=>`<th data-c="${i}"${S.num[i]?' class="n"':''} title="${L('Bấm để sắp xếp')}">${esc(S.head[i])}<span class="ar">${S.sc==i?(S.sd>0?'↑':'↓'):''}</span><i class="rz" data-r="${i}"></i></th>`).join('')}</tr><tr><th class="rn ft"></th>${vis.map(i=>`<th class="ft"><input data-cf="${i}" placeholder="${L('Lọc…')}" value="${esc(S.cf[i]||'')}"></th>`).join('')}</tr></thead><tbody>`;
 for(const ri of sl)h+=`<tr data-i="${ri}"${ri==S.sel?' class="sel"':''}><td class="rn">${ri+1}</td>`+S.rows[ri].map((v,i)=>S.hid.has(i)?'':`<td${S.num[i]?' class="n"':''} title="${esc(v)}">${esc(v)}</td>`).join('')+'</tr>';
 $('#grid').innerHTML=h+'</tbody></table>'+(sl.length?'':'<div class="none">'+L('Không có hàng nào khớp')+'</div>');
 $('#sInfo').textContent=`${S.view.length.toLocaleString()}/${S.rows.length.toLocaleString()} ${L('hàng')} · ${S.head.length} ${L('cột')} · ${fmtSize(S.size)}`;
 $('#pg').textContent=`${S.page+1}/${pages}`;if(S.mode!='table')drawCards(sl);$('#pp').disabled=S.page==0;$('#pn').disabled=S.page>=pages-1}

const OPS={'=':'bằng','≠':'khác','>':'lớn hơn','<':'nhỏ hơn','≥':'lớn hơn hoặc bằng','≤':'nhỏ hơn hoặc bằng',ct:'chứa',sw:'bắt đầu bằng',ew:'kết thúc bằng',em:'để trống',ne:'không trống'};
function test(v,f){const a=String(v==null?'':v),b=String(f.v),n=a!==''&&b!==''&&isFinite(a)&&isFinite(b),x=n?+a:a.toLowerCase(),y=n?+b:b.toLowerCase(),al=a.toLowerCase();
 switch(f.o){case'=':return x===y;case'≠':return x!==y;case'>':return n?x>y:cmp(a,b)>0;case'<':return n?x<y:cmp(a,b)<0;case'≥':return n?x>=y:cmp(a,b)>=0;case'≤':return n?x<=y:cmp(a,b)<=0;
 case'ct':return al.includes(y);case'sw':return al.startsWith(y);case'ew':return al.endsWith(y);case'em':return a.trim()==='';case'ne':return a.trim()!==''}}
function fcount(){const n=S.flt.length,z=f=>['em','ne'].includes(f.o);$('#fc').hidden=!n;$('#fc').textContent=n;

 const co=S.head.map((h,i)=>`<option value="${i}">${esc(h)}</option>`).join(''),op=Object.entries(OPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  $('#fbody').innerHTML=S.flt.map((f,j)=>`<div class="fr" data-j="${j}"><select class="in" data-k="c">${co}</select><select class="in" data-k="o">${op}</select><input class="in" data-k="v" placeholder="Giá trị" value="${esc(f.v)}"${f.o=='em'||f.o=='ne'?' disabled':''}><button class="btn" data-del title="Xóa">✕</button></div>`).join('')

 $('#fbody').querySelectorAll('.fr').forEach(r=>{const f=S.flt[r.dataset.j];r.querySelector('[data-k=c]').value=f.c;r.querySelector('[data-k=o]').value=f.o;
  r.oninput=e=>{const k=e.target.dataset.k;if(!k)return;f[k]=k=='c'?+e.target.value:e.target.value;if(k=='o')fltUI();apply();fcount()};
  r.querySelector('[data-del]').onclick=()=>{S.flt.splice(+r.dataset.j,1);fltUI();apply();fcount()}});
 $('#fa').onclick=()=>{S.flt.push({c:0,o:'ct',v:''});fltUI()};$('#fx').onclick=()=>{S.flt=[];fltUI();apply();fcount()};retr()}

async function save(blob,ext){const name=(S.name||'data').replace(/\.\w+$/,'')+'-export.'+ext;
 if(TA){try{const u=new Uint8Array(await blob.arrayBuffer());let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  if(await TA.core.invoke('save_file',{name,data:btoa(b)}))toast('Đã xuất '+S.view.length+' hàng')}catch(e){toast('Không lưu được tệp')}return}

 if(x=='csv'){const q=v=>/[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;save(new Blob(['\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}),'csv')}

 else new Promise((ok,no)=>{if(window.XLSX)return ok();const e=document.createElement('script');e.src='vendor/xlsx.mini.min.js';e.onload=ok;e.onerror=no;document.head.append(e)}).then(()=>{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([head,...rows]),'Sheet1');save(new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'}),'xlsx')}).catch(()=>toast('Không xuất được Excel'))}));
