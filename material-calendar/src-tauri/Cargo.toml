[package]
name = "material-calendar"
version = "1.0.0"
description = "Material Calendar — a Material Design 3 desktop calendar built with Tauri 2"
authors = ["minhtrong67"]
edition = "2021"
license = "MIT"

[lib]
name = "material_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
